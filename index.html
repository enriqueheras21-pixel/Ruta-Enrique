<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  .sortable-ghost { opacity: .35; }
  .sortable-chosen { box-shadow: 0 12px 30px rgba(0,0,0,.25); }
  #toast { transition: opacity .25s, transform .25s; }
  .leaflet-container { font-family: inherit; background: #e5e7eb; }
  .dark .leaflet-container { background: #0f172a; }
  .dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.95) contrast(.9); }
  .pin-num { display:flex; align-items:center; justify-content:center; border:3px solid #fff; border-radius:9999px; font-weight:700; box-shadow:0 2px 6px rgba(0,0,0,.45); }

  /* ===== Hoja del dia (pantalla e impresion) ===== */
  #sheetView { display:none; position:fixed; inset:0; z-index:5000; overflow:auto; background:#e2e8f0; color:#0f172a; }
  #sheetView.open { display:block; }
  .sheet-page { background:#fff; max-width:820px; margin:12px auto 40px; padding:22px 20px; box-shadow:0 4px 20px rgba(0,0,0,.15); font-family: Roboto, Arial, sans-serif; }
  .sheet-page h1 { font-size:20px; font-weight:700; margin:0 0 4px; }
  .sheet-page .sub { font-size:14px; margin:0 0 4px; }
  .sheet-page .route-name { font-size:13px; color:#475569; margin:0 0 12px; }
  .sheet-table { width:100%; border-collapse:collapse; font-size:12px; }
  .sheet-table th { background:#1a73e8; color:#fff; font-weight:500; padding:8px 6px; border:1px solid #1a5fd0; text-align:center; }
  .sheet-table td { border:1px solid #9ec2f5; padding:7px 6px; vertical-align:middle; }
  .sheet-table tr:nth-child(even) td { background:#e8f0fe; }
  .sheet-table td.num { text-align:center; width:34px; }
  .sheet-table .late { color:#b91c1c; } .sheet-table .early { color:#15803d; }
  .sheet-foot { font-size:11px; color:#64748b; margin-top:10px; }
  @page { size: letter; margin: 12mm; }
  @media print {
    html, body { height:auto; background:#fff !important; }
    #app, #modalRoot, #toast, .no-print { display:none !important; }
    #sheetView { display:block !important; position:static !important; overflow:visible !important; background:#fff !important; }
    .sheet-page { box-shadow:none; margin:0; padding:0; max-width:none; }
    .sheet-table th { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .sheet-table tr:nth-child(even) td { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  }
</style>

<div id="app" class="relative mx-auto h-[100dvh] max-w-md overflow-hidden bg-white dark:bg-slate-950 md:max-w-3xl">

  <!-- ===== Vista 1: Historial de rutas (se abre con el boton de menu de la ruta) ===== -->
  <section id="viewList" class="flex h-full flex-col">
    <header class="flex items-center gap-3 px-4 pb-3" style="padding-top:max(env(safe-area-inset-top),14px)">
      <button id="todayBtn" aria-label="Volver a la ruta de hoy" class="grid h-12 w-12 shrink-0 place-items-center rounded-full bg-slate-100 text-3xl font-bold leading-none dark:bg-slate-800">&lsaquo;</button>
      <div class="min-w-0 flex-1">
        <h1 class="text-2xl font-bold leading-tight">Historial <span id="verTag" class="text-xs font-semibold text-slate-400"></span></h1>
        <p id="baseInfo" class="truncate text-xs font-semibold text-slate-500"></p>
      </div>
      <button id="globalBtn" aria-label="Ajustes generales" class="grid h-12 w-12 place-items-center rounded-xl border-2 border-slate-300 text-xl dark:border-slate-700">&#x2699;</button>
      <button class="themeBtn grid h-12 w-12 place-items-center rounded-xl border-2 border-slate-300 text-xl dark:border-slate-700" aria-label="Cambiar tema"></button>

      <!-- Manija: arrastra hacia abajo para ver el mapa, hacia arriba para ver la lista -->

<script>
(() => {
  // =====================================================================
  // 1) DATOS FIJOS
  // =====================================================================
  const PHOTON = 'https://photon.komoot.io/api/';
  const NOMINATIM = 'https://nominatim.openstreetmap.org/search';
  const OSRM = 'https://router.project-osrm.org';
  const BBOX = '-71.75,-34.30,-69.95,-32.90';           // Regi\u00f3n Metropolitana
  const TRAFFIC = 1;                                     // OSRM da tiempos sin trafico; el trafico se aplica segun la hora (TRAFICO_SCL)
  // Trafico tipico de Santiago segun dia y hora: multiplica el tiempo de manejo sin trafico.
  // [desde, hasta (minutos del dia), factor]. Punta manana 7:00-9:30 y punta tarde 17:30-20:30.
  const TRAFICO_SCL = {
    habil:   [[0, 420, 1.15], [420, 570, 1.75], [570, 720, 1.35], [720, 900, 1.45], [900, 1050, 1.4], [1050, 1230, 1.8], [1230, 1440, 1.2]],
    sabado:  [[0, 600, 1.15], [600, 840, 1.35], [840, 1140, 1.3], [1140, 1440, 1.15]],
    domingo: [[0, 660, 1.1], [660, 1080, 1.2], [1080, 1440, 1.15]],
  };
  function trafficFactor(min, dow) {
    const tbl = dow === 0 ? TRAFICO_SCL.domingo : dow === 6 ? TRAFICO_SCL.sabado : TRAFICO_SCL.habil;
    const m = ((Math.round(min) % 1440) + 1440) % 1440;
    return (tbl.find(([a, b]) => m >= a && m < b) || [0, 0, 1.2])[2];
  }
  const isPeak = (min, dow) => trafficFactor(min, dow) >= 1.7;
  // Zonas que se ponen peores que el promedio a ciertas horas (se multiplica sobre lo anterior).
  // Centro (incluye Franklin / Meiggs): peor en punta, al almuerzo y el sabado de comercio.
  // Oriente: peor en las puntas. Ajustable si en la practica Enrique ve otra cosa.
  const ZONA = {
    centro: ['Santiago', 'Estaci\u00f3n Central', 'Independencia', 'Recoleta', 'San Miguel'],
    oriente: ['Providencia', 'Las Condes', 'Vitacura', '\u00d1u\u00f1oa', 'La Reina', 'Lo Barnechea'],
  };
  function zoneFactor(min, dow, comuna) {
    const m = ((Math.round(min) % 1440) + 1440) % 1440, peak = isPeak(min, dow), habil = dow >= 1 && dow <= 5;
    if (ZONA.centro.includes(comuna)) {
      if (habil && peak) return 1.15;
      if (habil && m >= 720 && m < 900) return 1.1;
      if (dow === 6 && m >= 540 && m < 900) return 1.2;
      return 1;
    }
    if (ZONA.oriente.includes(comuna) && habil && peak) return 1.1;
    return 1;
  }
  const SERVICE_MIN = 4;                                 // minutos promedio por entrega
  const LATE = 10;                                       // castigo por minuto de atraso al optimizar
  const APP_VERSION = 'v23';
  const LKEY = 'ruta-enrique-v3';                        // misma clave de siempre: no se pierden rutas
  const DEFAULT_BASE = { address: 'Chile Espa\u00f1a 592', comuna: '\u00d1u\u00f1oa', lat: -33.4497, lng: -70.6036, precise: false };
  const NOTE_CHIPS = ['bodega', 'carga de pedido mayorista', 'despacho pedido mayorista', 'llegada estacionamiento', 'dejar en conserjer\u00eda', 'mercado libre env\u00edo'];

  const COMUNAS = [
    ['Alhu\u00e9', -34.035, -71.098], ['Buin', -33.732, -70.742], ['Calera de Tango', -33.630, -70.770],
    ['Cerrillos', -33.495, -70.715], ['Cerro Navia', -33.425, -70.735], ['Colina', -33.200, -70.670],
    ['Conchal\u00ed', -33.385, -70.675], ['Curacav\u00ed', -33.406, -71.133], ['El Bosque', -33.565, -70.675],
    ['El Monte', -33.680, -71.017], ['Estaci\u00f3n Central', -33.460, -70.700], ['Huechuraba', -33.370, -70.635],
    ['Independencia', -33.415, -70.665], ['Isla de Maipo', -33.750, -70.900], ['La Cisterna', -33.530, -70.663],
    ['La Florida', -33.522, -70.598], ['La Granja', -33.540, -70.625], ['La Pintana', -33.585, -70.630],
    ['La Reina', -33.445, -70.540], ['Lampa', -33.285, -70.875], ['Las Condes', -33.410, -70.565],
    ['Lo Barnechea', -33.350, -70.518], ['Lo Espejo', -33.520, -70.690], ['Lo Prado', -33.445, -70.725],
    ['Macul', -33.490, -70.598], ['Maip\u00fa', -33.510, -70.757], ['Mar\u00eda Pinto', -33.515, -71.120],
    ['Melipilla', -33.689, -71.215], ['\u00d1u\u00f1oa', -33.456, -70.597], ['Padre Hurtado', -33.570, -70.815],
    ['Paine', -33.808, -70.740], ['Pedro Aguirre Cerda', -33.490, -70.675], ['Pe\u00f1aflor', -33.606, -70.876],
    ['Pe\u00f1alol\u00e9n', -33.485, -70.545], ['Pirque', -33.670, -70.580], ['Providencia', -33.430, -70.610],
    ['Pudahuel', -33.440, -70.760], ['Puente Alto', -33.611, -70.575], ['Quilicura', -33.360, -70.730],
    ['Quinta Normal', -33.428, -70.698], ['Recoleta', -33.405, -70.640], ['Renca', -33.405, -70.725],
    ['San Bernardo', -33.592, -70.700], ['San Joaqu\u00edn', -33.495, -70.628], ['San Jos\u00e9 de Maipo', -33.642, -70.352],
    ['San Miguel', -33.497, -70.651], ['San Pedro', -33.894, -71.461], ['San Ram\u00f3n', -33.535, -70.645],
    ['Santiago', -33.4489, -70.6693], ['Talagante', -33.665, -70.930], ['Tiltil', -33.083, -70.928],
    ['Vitacura', -33.390, -70.590],
  ];
  const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  const COMUNA = Object.fromEntries(COMUNAS.map(([n, lat, lng]) => [n, { lat, lng }]));
  const COMUNA_BY_NORM = Object.fromEntries(COMUNAS.map(([n]) => [norm(n), n]));
  const COMUNAS_BY_LEN = COMUNAS.map(([n]) => n).sort((a, b) => b.length - a.length);

  // =====================================================================
  // 2) UTILIDADES
  // =====================================================================
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pad = n => String(n).padStart(2, '0');
  const dayStr = (off = 0) => { const d = new Date(); d.setDate(d.getDate() + off); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const dateObj = s => { const [y, m, d] = (s || dayStr()).split('-').map(Number); return new Date(y, m - 1, d); };
  const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
  const toMin = s => { const [h, m] = String(s || '09:00').split(':').map(Number); return h * 60 + (m || 0); };
  const hhmm = m => { m = Math.round(m); return pad(Math.floor(m / 60) % 24) + ':' + pad(((m % 60) + 60) % 60); };
  function dateLabel(s) {
    if (s === dayStr(0)) return 'Hoy';
    if (s === dayStr(1)) return 'Ma\u00f1ana';
    if (s === dayStr(-1)) return 'Ayer';
    const t = dateObj(s).toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric', month: 'long' });
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  const weekday = s => dateObj(s).toLocaleDateString('es-CL', { weekday: 'long' });
  // Nombre autom\u00e1tico como Spoke: la 1\u00aa ruta del d\u00eda lleva la fecha ("Domingo 22 nov"); las siguientes "Ruta 2", "Ruta 3"\u2026
  function dateName(s) {
    const d = dateObj(s), t = `${weekday(s)} ${d.getDate()} ${d.toLocaleDateString('es-CL', { month: 'short' }).replace('.', '')}`;
    return t.charAt(0).toUpperCase() + t.slice(1);
  }
  // Titulo de una ruta: el nombre que Enrique le puso, o si no tiene, la fecha ("Domingo 22 nov")
  const titleOf = r => r.name || dateName(r.date);
  function autoName(date, exceptId) {
    const n = Object.values(routes).filter(x => x.date === date && x.id !== exceptId && !x.sample).length;
    return n ? `Ruta ${n + 1}` : dateName(date);
  }
  // "s\u00e1bado - s\u00e1b 21 de nov" (como la hoja de Spoke)
  function sheetDate(s) {
    const d = dateObj(s);
    const short = d.toLocaleDateString('es-CL', { weekday: 'short' }).replace('.', '');
    const mon = d.toLocaleDateString('es-CL', { month: 'short' }).replace('.', '');
    return `${weekday(s)} - ${short} ${d.getDate()} de ${mon}`;
  }
  const fmtDur = min => { min = Math.max(0, Math.round(min)); const h = Math.floor(min / 60), m = min % 60; return h ? `${h} h ${m} min` : `${m} min`; };
  const fmtDist = (km, units = prefs.units) => {
    const v = units === 'mi' ? km * 0.621371 : km;
    return v.toLocaleString('es-CL', { maximumFractionDigits: 1, minimumFractionDigits: v < 10 ? 1 : 0 }) + (units === 'mi' ? ' mi' : ' km');
  };
  // Desviaci\u00f3n entre hora real y estimada: "+2 min tarde", "10 min antes", "a tiempo"
  function devText(real, est) {
    if (real == null || est == null) return '';
    const d = Math.round(real - est);
    if (Math.abs(d) < 1) return 'a tiempo';
    return d > 0 ? `${d} min tarde` : `${-d} min antes`;
  }
  const devClass = (real, est) => (real == null || est == null) ? '' : (real - est >= 1 ? 'late' : (est - real >= 1 ? 'early' : ''));
  function fetchJson(url, ms = 9000, signal) {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), ms);
    if (signal) signal.addEventListener('abort', () => ctrl.abort());
    return fetch(url, { signal: ctrl.signal }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).finally(() => clearTimeout(t));
  }
  function findComuna(text) {
    const t = norm(text);
    for (const n of COMUNAS_BY_LEN) { const k = norm(n); if (new RegExp('(^|[^a-z])' + k.replace(/ /g, '\\s+') + '($|[^a-z])').test(t)) return n; }
    return '';
  }
  const fullAddress = s => [s.address, s.comuna].filter(Boolean).join(', ');
  // Como Spoke: "Nombre del local, Comuna" arriba y la direccion debajo; en la hoja: "Nombre, direccion, comuna"
  const stopTitle = s => s.customerName ? [s.customerName, s.comuna].filter(Boolean).join(', ') : s.address;
  const stopSub = s => s.customerName ? fullAddress(s) : (s.comuna || '');
  const stopLabel = s => s.customerName ? `${s.customerName}, ${fullAddress(s)}` : fullAddress(s);

  // =====================================================================
  // 3) B\u00daSQUEDA DE DIRECCIONES (gratis: Photon + Nominatim de OpenStreetMap)
  // =====================================================================
  function comunaFrom(p) {
    for (const k of ['city', 'county', 'district', 'locality']) { const n = COMUNA_BY_NORM[norm(p[k])]; if (n) return n; }
    return p.city || p.county || p.district || '';
  }
  // Entiende "741 franklin", "franklin 741", "av el parque 1000, pudahuel", "Pedro Torres #1227"
  function parseQuery(raw) {
    let q = raw.replace(/\s+/g, ' ').replace(/(n[\u00b0\u00bao]\.?|#)\s*(\d)/gi, '$2').trim();
    let num = '', m = q.match(/^(.+?)\s+(\d{1,5}[a-z]?)(\s*,.*)?$/i);
    if (m) { num = m[2]; q = m[1] + (m[3] || ''); }
    else if ((m = q.match(/^(\d{1,5}[a-z]?)\s+(.+)$/i))) { num = m[1]; q = m[2]; }
    return { street: q.trim(), num };
  }
  const ABBR = [
    [/^(av|avda|avd)\.?\s+/i, 'avenida '], [/^(pje|psje)\.?\s+/i, 'pasaje '], [/^(cll|cl)\.?\s+/i, 'calle '],
    [/\bgral\.?\s+/i, 'general '], [/\bstgo\b\.?/i, 'santiago'], [/\bsta\.?\s+/i, 'santa '], [/\bsto\.?\s+/i, 'santo '],
  ];
  const expand = s => ABBR.reduce((t, [re, rep]) => t.replace(re, rep), s);
  const stripType = s => s.replace(/^(avenida|calle|pasaje|camino)\s+/i, '');
  async function photon(q, signal) {
    const c = ui.lastPos || { lat: -33.45, lng: -70.62 };   // prioriza lo cercano a donde estas
    const data = await fetchJson(`${PHOTON}?q=${encodeURIComponent(q)}&limit=12&bbox=${BBOX}&lat=${c.lat}&lon=${c.lng}`, 8000, signal);
    return (data.features || []).map(f => {
      const p = f.properties || {}, [lng, lat] = f.geometry.coordinates, isRoad = p.osm_key === 'highway';
      const poi = !isRoad && !!p.name && p.type !== 'street' && p.osm_key !== 'place' && p.osm_key !== 'boundary';
      return { street: p.street || (isRoad ? p.name : ''), house: p.housenumber || '', name: !isRoad ? (p.name || '') : '', poi, comuna: comunaFrom(p), lat, lng };
    });
  }
  // Direccion de un local que en el mapa no trae calle (ej. un mall): se pide la calle del punto
  async function reverseStreet(lat, lng) {
    try {
      const d = await fetchJson(`${PHOTON.replace('/api/', '/reverse')}?lat=${lat}&lon=${lng}&limit=5`, 4000);
      const f = (d.features || []).map(x => x.properties || {}).find(p => p.street || p.osm_key === 'highway');
      if (!f) return null;
      return { street: f.street || f.name, house: f.housenumber || '', comuna: comunaFrom(f) };
    } catch { return null; }
  }
  async function nominatim(q, signal) {
    const data = await fetchJson(`${NOMINATIM}?format=jsonv2&addressdetails=1&countrycodes=cl&limit=6&bounded=1&viewbox=-71.75,-32.90,-69.95,-34.30&accept-language=es&q=${encodeURIComponent(q)}`, 8000, signal);
    return (data || []).map(r => {
      const a = r.address || {};
      const p = { city: a.city || a.town || a.municipality, county: a.county, district: a.suburb || a.city_district, locality: a.village };
      return { street: a.road || '', house: a.house_number || '', name: a.road ? '' : (r.name || ''), comuna: comunaFrom(p), lat: +r.lat, lng: +r.lon };
    });
  }
  // Si se escribe "nombre del local + direccion" (ej. "la fiambreria pedro torres 1227") y no hay resultados,
  // se prueba quitando palabras del comienzo: lo quitado pasa a ser el nombre del local.
  async function searchAddress(raw, signal) {
    const res = await searchAddress1(raw, signal);
    if (res.length) return res;
    const words = raw.trim().split(/\s+/);
    for (let k = 1; k <= Math.min(4, words.length - 2); k++) {
      const rest = words.slice(k).join(' ');
      if (!/[a-z\u00e0-\u00ff]{3,}/i.test(rest)) break;
      const r2 = await searchAddress1(rest, signal);
      if (r2.length) {
        const name = words.slice(0, k).join(' ').replace(/(^|\s)\S/g, m => m.toUpperCase());
        return r2.map(x => ({ ...x, place: x.place || name, needAddr: false, poi: true }));
      }
    }
    return [];
  }
  async function searchAddress1(raw, signal) {
    const { street, num } = parseQuery(raw);
    const ex = expand(street), bare = stripType(ex);
    const withNum = s => (num ? `${s} ${num}` : s);
    const queries = [...new Set([withNum(street), withNum(ex), withNum(bare), bare].map(s => s.trim()).filter(Boolean))];
    const safe = p => p.catch(e => { if (e.name === 'AbortError') throw e; return []; });
    let all = (await Promise.all(queries.map(q => safe(photon(q, signal))))).flat();

    sparkle: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.2 6.3L20 10l-5.8 1.7L12 18l-2.2-6.3L4 10l5.8-1.7zM19 15l1 2.6 2.6 1-2.6 1L19 22l-1-2.4-2.6-1 2.6-1z"/></svg>',
  };
  const chip = (txt, cls = 'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300') => `<span class="inline-flex items-center gap-1 rounded-md px-1.5 py-0.5 ${cls}">${txt}</span>`;
  const ACTION = 'flex h-11 items-center justify-center gap-1.5 rounded-xl text-sm font-bold active:scale-95';
  const SMALL = 'h-11 rounded-xl border-2 border-slate-200 text-sm font-bold dark:border-slate-700';
  const devChip = (real, est) => {
    const t = devText(real, est); if (!t) return '';
    const c = devClass(real, est);
    return chip(t, c === 'late' ? 'bg-red-100 text-red-800 dark:bg-red-950 dark:text-red-200' : c === 'early' ? 'bg-green-100 text-green-800 dark:bg-green-950 dark:text-green-200' : undefined);
  };

  function renderRoute() {
    const r = cur(), t = totals(r), sm = t.sm;
    $('routeDay').textContent = weekday(r.date);
    $('routeTitle').textContent = r.name ? `${r.name} \u00b7 ${dateLabel(r.date)}` : dateObj(r.date).toLocaleDateString('es-CL', { day: 'numeric', month: 'long' });
    const endTxt = t.endReal != null ? `Finaliz\u00f3 a las ${hhmm(t.endReal)}` : `Finaliza a las ${hhmm(t.endEst)}`;
    $('summary').textContent = sm.total ? `${endTxt} \u2022 ${sm.total} parada${sm.total === 1 ? '' : 's'} \u2022 ${fmtDist(t.km)}` : 'Ruta vac\u00eda';
    const info = [];
    if (sm.total && sm.gps) info.push('\ud83d\udccd Ordenada desde tu ubicaci\u00f3n actual');
    if (sm.total && r._peak) info.push('\ud83d\udea6 Incluye hora punta: tiempos con m\u00e1s tr\u00e1fico');
    if (sm.late) info.push(`\u26a0 ${sm.late} parada${sm.late > 1 ? 's' : ''} llegar\u00eda${sm.late > 1 ? 'n' : ''} tarde`);
    if (sm.pending > 1 && !r.optimized) info.push('Orden sin optimizar: toca "Optimizar"');
    $('calcInfo').textContent = info.join(' \u2022 ');
    $('loadBtn').textContent = r.load ? `\ud83d\ude9a Cargado ${hhmm(r.load.min)}` : '\ud83d\ude9a Cargar veh\u00edculo';
    $('hint').textContent = ui.select ? (ui.select.mode === 'delete' ? 'Toca las paradas que quieres eliminar.' : 'Toca las paradas que quieres mover.')
      : !sm.total ? 'Escribe una direcci\u00f3n arriba para agregar la primera parada.' : '';
    $('hint').classList.toggle('hidden', !$('hint').textContent);
    renderBaseRows(r, t);
    renderStops(r);
    renderFooter(r, sm, t);
    renderMap(r);
  }

  // Columna izquierda de la linea de tiempo (icono/numero + hora)
  const tlLeft = (badgeHtml, time, timeCls = '') => `<div class="relative z-10 flex w-14 shrink-0 flex-col items-center pt-0.5">${badgeHtml}
      <span class="mt-0.5 text-xs font-bold ${timeCls}">${time || ''}</span></div>`;
  const ROW = 'relative flex w-full gap-2 rounded-xl px-1 py-2 text-left';
  // Tramo entre paradas: tiempo y distancia desde la parada anterior (como Spoke)
  const legLine = (min, km) => (min == null || km == null) ? '' :
    `<p class="text-[11px] font-semibold text-slate-400">\ud83d\ude97 ${fmtDur(min)} \u00b7 ${fmtDist(km)}</p>`;

  // Filas fijas de salida y regreso a la base
  function renderBaseRows(r, t) {
    const b = r.start, est = toMin(r.startTime);
    const home = '<span class="grid h-7 w-7 place-items-center rounded-full bg-blue-100 text-sm dark:bg-blue-950">\ud83c\udfe0</span>';
    $('startRow').innerHTML = `<div role="button" data-base="start" class="${ROW} cursor-pointer">
        ${tlLeft(home, hhmm(r.load ? r.load.min : est))}
        <div class="min-w-0 flex-1">
          <p class="text-base font-semibold leading-tight">${esc(b.address)}</p>
          <p class="text-sm text-slate-500">${esc([b.comuna, 'Salida de bodega'].filter(Boolean).join(' \u00b7 '))}</p>
          ${r.load ? `<div class="mt-1 flex flex-wrap gap-1.5 text-xs font-semibold">${chip('Sali\u00f3 ' + hhmm(r.load.min))}${Math.abs(r.load.min - est) <= 90 ? devChip(r.load.min, est) : ''}</div>` : ''}
          ${r.load && r.load.note ? `<p class="mt-1 text-sm text-slate-700 dark:text-slate-300">\ud83d\udcdd ${esc(r.load.note)}</p>` : ''}
          ${r.load ? '' : '<button data-now class="mt-2 h-12 w-full rounded-xl bg-blue-600 text-base font-bold text-white active:scale-[.98]">\u23f1 Marcar salida ahora</button>'}
        </div></div>`;
    if (r.returnToStart === false || !r.stops.length) { $('endRow').innerHTML = ''; return; }
    const flag = '<span class="grid h-7 w-7 place-items-center rounded-full bg-blue-100 text-sm dark:bg-blue-950">\ud83c\udfc1</span>';
    const lastS = r.stops[r.stops.length - 1], mm = M(r), dep = depotOf(r);
    const backLeg = r.endedMin == null ? legLine(r._backMin ?? mm.dur(lastS, dep), mm.dist(lastS, dep)) : '';
    $('endRow').innerHTML = `<div role="button" data-base="end" class="${ROW} cursor-pointer">
        ${tlLeft(flag, hhmm(r.endedMin ?? t.endEst))}
        <div class="min-w-0 flex-1">
          ${backLeg}
          <p class="text-base font-semibold leading-tight">${esc(b.address)}</p>
          <p class="text-sm text-slate-500">${esc([b.comuna, 'Regreso a la base'].filter(Boolean).join(' \u00b7 '))}</p>
          ${r.endedMin != null ? `<div class="mt-1 flex flex-wrap gap-1.5 text-xs font-semibold">${chip('Lleg\u00f3 ' + hhmm(r.endedMin))}${devChip(r.endedMin, t.endEst)}</div>` : ''}
        </div></div>`;
  }

  function renderStops(r) {
    const next = r.stops.find(s => s.status === 'pending');
    if (!r.stops.length) {
      $('list').innerHTML = `<li class="px-3 py-6 text-center">
        <p class="text-slate-500">Agrega las primeras paradas para empezar a crear la ruta</p>
        <button data-act="addFirst" class="mt-4 h-14 w-full rounded-2xl bg-blue-600 text-lg font-bold text-white">+ Agregar paradas</button>
        <button data-act="copyFrom" class="mt-2 h-12 w-full font-bold text-blue-700 dark:text-blue-300">Copiar paradas de una ruta anterior</button></li>`;
      return;
    }
    const sel = ui.select;
    $('list').innerHTML = r.stops.map((s, i) => {
      const pending = s.status === 'pending', active = !sel && s.id === ui.activeId;
      const est = pending ? s.etaMin : (s.plannedMin ?? s.etaMin);
      const time = pending ? (s.etaMin != null ? hhmm(s.etaMin) : '') : (s.doneMin != null ? hhmm(s.doneMin) : '');
      const timeCls = pending ? (s.late ? 'text-red-600' : '') : (devClass(s.doneMin, est) === 'late' ? 'text-red-600' : 'text-green-700 dark:text-green-400');
      const chips = [];
      if (!pending) { if (est != null) chips.push(chip('Estimada ' + hhmm(est))); chips.push(devChip(s.doneMin, est)); }
      if (s.kind === 'pickup') chips.push(chip('\u2191 Recolecci\u00f3n', 'bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-200'));
      if (s.timeWindowStart) chips.push(chip('desde ' + esc(s.timeWindowStart)));
      if (s.timeWindowEnd) chips.push(chip('antes de ' + esc(s.timeWindowEnd)));
      if ((s.priority || 'normal') !== 'normal') chips.push(chip(s.priority === 'first' ? 'Primera' : '\u00daltima', 'bg-yellow-100 text-yellow-900 dark:bg-yellow-900 dark:text-yellow-100'));
      if (s.photos?.length) chips.push(chip('\ud83d\udcf7 ' + s.photos.length));
      if (s.vehiclePosition || s.packageInfo) chips.push(chip('\ud83d\udce6 ' + esc([s.vehiclePosition, s.packageInfo].filter(Boolean).join(' \u00b7 '))));
      if (!s.precise) chips.push(chip('ubicaci\u00f3n aprox.', 'bg-orange-100 text-orange-800 dark:bg-orange-950 dark:text-orange-200'));

      let status = '';
      if (s.status === 'delivered') status = `<p class="mt-1 text-sm font-semibold text-green-700 dark:text-green-400">\u2714 Entregada${s.pod?.recipient ? ' \u00b7 recibi\u00f3 ' + esc(s.pod.recipient) : ''}${s.pod?.hasPhoto ? ' \u00b7 con foto' : ''}${s.pod?.hasSig ? ' \u00b7 con firma' : ''}</p>`;
      if (s.status === 'failed') status = `<p class="mt-1 text-sm font-semibold text-red-700 dark:text-red-400">\u2716 No entregada: ${esc(s.pod?.reasonLabel || '')}</p>`;
      if (!pending && s.pod?.note) status += `<p class="text-sm text-slate-500">${esc(s.pod.note)}</p>`;

      const actions = !sel && pending && (active || s.id === next?.id) ? `
        <div class="mt-3 grid grid-cols-3 gap-2">
          <a href="${navUrl(prefs.navApp, s)}" target="_blank" rel="noopener" class="${ACTION} bg-blue-600 text-white">${ICON.nav} Ir</a>
          ${s.customerPhone ? `<a href="${waUrl(s)}" target="_blank" rel="noopener" class="${ACTION} bg-emerald-600 text-white">${ICON.chat} Aviso</a>` : `<button data-act="note" data-id="${s.id}" class="${ACTION} bg-slate-100 dark:bg-slate-800">\ud83d\udcdd Nota</button>`}
          <button data-act="pod" data-id="${s.id}" class="${ACTION} bg-slate-900 text-white dark:bg-white dark:text-slate-900">${ICON.check} Listo</button>
        </div>` : '';
      const edits = false ? `
        <div class="mt-2 grid grid-cols-3 gap-2">
          <button data-act="edit" data-id="${s.id}" class="${SMALL}">\u270e ${pending ? 'Editar' : 'Hora / nota'}</button>
          ${pending ? `<button data-act="note" data-id="${s.id}" class="${SMALL}">\ud83d\udcdd Nota</button>` : `<button data-act="undo" data-id="${s.id}" class="${SMALL}">\u21ba Deshacer</button>`}
          <button data-act="del" data-id="${s.id}" class="${SMALL} ${ui.confirmDel === s.id ? 'border-red-600 bg-red-600 text-white' : 'text-red-600'}">${ui.confirmDel === s.id ? '\u00bfBorrar?' : '\ud83d\uddd1 Borrar'}</button>
        </div>` : '';
      const checked = sel && sel.ids.has(s.id);
      const right = sel
        ? `<span class="grid h-10 w-8 shrink-0 place-items-center"><span class="grid h-6 w-6 place-items-center rounded-md border-2 ${checked ? 'border-blue-600 bg-blue-600 text-white' : 'border-slate-400'} text-sm font-bold">${checked ? '\u2713' : ''}</span></span>`
        : `<span class="handle grid h-10 w-8 shrink-0 cursor-grab touch-none place-items-center text-slate-400 ${pending ? '' : 'invisible'}" aria-label="Arrastrar">${ICON.grip}</span>`;
      const num = `<span class="grid h-7 w-7 place-items-center rounded-full text-xs font-bold ${badge(s)}">${pending ? i + 1 : (s.status === 'delivered' ? '\u2713' : '\u2715')}</span>`;
      return `<li id="stop-${s.id}" data-id="${s.id}" data-act="select"
          class="${ROW} ${active || checked ? 'bg-blue-50 dark:bg-slate-900' : ''} ${s.id === next?.id && !sel ? 'ring-2 ring-inset ring-blue-200 dark:ring-blue-900' : ''}">
        ${tlLeft(num, time, timeCls)}
        <div class="min-w-0 flex-1">
          ${pending ? legLine(s.legMin, s.legKm) : ''}
          <p class="text-base font-semibold leading-tight ${pending ? '' : 'text-slate-500'}">${esc(stopTitle(s))}</p>
          <p class="truncate text-xs text-slate-500">${esc(stopSub(s))}</p>
          ${chips.length ? `<div class="mt-1 flex flex-wrap gap-1 text-[11px] font-semibold">${chips.join('')}</div>` : ''}
          ${s.notes ? `<p class="mt-0.5 text-xs text-slate-700 dark:text-slate-300">\ud83d\udcdd ${esc(s.notes)}</p>` : ''}
          ${status}${actions}${edits}
        </div>${right}
      </li>`;
    }).join('');
  }

  function renderFooter(r, sm, t) {
    const f = $('routeFooter');
    if (ui.select) {
      const n = ui.select.ids.size, isDel = ui.select.mode === 'delete';
      f.innerHTML = `<div class="mb-2 flex items-center justify-between text-sm font-semibold">
          <button data-f="all" class="text-blue-700 dark:text-blue-300">Seleccionar todas</button><span>${n} seleccionada${n === 1 ? '' : 's'}</span>
          <button data-f="cancel" class="text-slate-500">Cancelar</button></div>
        <button data-f="go" ${n ? '' : 'disabled'} class="flex h-14 w-full items-center justify-center rounded-2xl text-lg font-bold text-white disabled:opacity-50 ${isDel ? 'bg-red-600' : 'bg-blue-600'}">${isDel ? `\ud83d\uddd1 Eliminar ${n}` : `\u2195 Mover ${n} a otra ruta`}</button>`;
      return;
    }
    const d = dateObj(r.date);
    const left = `<div class="min-w-0 shrink-0"><p class="text-2xl font-bold leading-tight text-green-700 dark:text-green-400">${sm.total ? fmtDur(t.durMin) : '\u2014'}</p>
      <p class="text-xs font-semibold text-slate-500">\ud83d\udd52 ${d.getDate()}-${d.toLocaleDateString('es-CL', { month: 'short' }).replace('.', '')}</p></div>`;
    let btn;
    if (sm.total && !sm.pending && t.endReal == null) btn = `<button data-f="finish" class="flex h-14 flex-1 items-center justify-center gap-2 rounded-2xl bg-green-600 text-lg font-bold text-white active:scale-[.98]">\ud83c\udfc1 Llegu\u00e9 a la base</button>`;
    // Ruta terminada: aviso discreto y boton chico (la hoja tambien esta arriba), para no tapar la lista
    else if (t.endReal != null) btn = `<span class="flex-1 text-sm font-semibold text-green-700 dark:text-green-400">\ud83c\udfc1 Ruta terminada</span>
      <button data-f="print" class="h-10 shrink-0 rounded-xl border border-slate-300 px-3 text-xs font-bold text-slate-600 dark:border-slate-700 dark:text-slate-300">\ud83d\udda8 Hoja</button>`;
    else btn = `<button data-f="upd" ${sm.pending ? '' : 'disabled'} class="flex h-14 shrink-0 flex-col items-center justify-center rounded-2xl border-2 border-slate-300 px-3 text-xs font-bold active:scale-[.98] disabled:opacity-50 dark:border-slate-700"><span class="text-lg leading-none">\u21bb</span>Actualizar</button>
      <button data-f="opt" ${sm.pending < 2 ? 'disabled' : ''} class="flex h-14 flex-1 items-center justify-center gap-2 rounded-2xl bg-blue-600 text-lg font-bold text-white transition active:scale-[.98] disabled:opacity-50">${ICON.sparkle} Optimizar</button>`;
    f.innerHTML = `<div class="flex items-center gap-2">${left}${btn}</div>`;
  }

  // ---------- Panel deslizable (como Spoke): arrastra la manija o el encabezado ----------
  const SNAP = [0.36, 0.6, 0.93];
  const isMobile = () => window.innerWidth < 768;
  function setSheet(frac, refit = true) {
    $('viewRoute').style.setProperty('--sheetH', (frac * 100).toFixed(1) + '%');
    ui.sheetFrac = frac;
    $('locBtn').classList.toggle('hidden', frac > 0.8);
    // Solo se ajusta el tamano del mapa (sin re-encuadrar ni recargar los cuadritos): mas rapido y sin saltos
    if (map) setTimeout(() => map.invalidateSize({ pan: false }), 220);
  }
  // Arrastre con el dedo (como Spoke): manija, encabezado y TAMBIEN la lista.
  // En la lista: deslizar hacia arriba primero sube el panel hasta arriba y recien ahi hace scroll;
  // deslizar hacia abajo estando al comienzo de la lista baja el panel.
  function wireSheetDrag(el, { isList = false, tapToggle = false } = {}) {
    let y0 = null, h0 = 0, H = 1, moved = 0, lastY = 0, lastT = 0, vel = 0, dragging = false, raf = 0;
    const apply = () => { raf = 0; const f = Math.min(0.95, Math.max(0.3, (h0 - (lastY - y0)) / H)); $('viewRoute').style.setProperty('--sheetH', (f * 100).toFixed(1) + '%'); };
    el.addEventListener('touchstart', e => {
      if (!isMobile() || e.touches.length > 1) return;
      if (!isList && e.target.closest('select,textarea')) return;   // botones y buscador tambien sirven para arrastrar
      y0 = lastY = e.touches[0].clientY; lastT = performance.now(); vel = 0; moved = 0;
      H = $('viewRoute').clientHeight; h0 = $('panel').offsetHeight; dragging = !isList;
      if (dragging) $('panel').style.transition = 'none';
    }, { passive: true });
    el.addEventListener('touchmove', e => {
      if (y0 == null) return;
      const y = e.touches[0].clientY, now = performance.now();
      vel = (y - lastY) / Math.max(1, now - lastT); lastY = y; lastT = now; moved = Math.max(moved, Math.abs(y - y0));
      if (isList && !dragging) {
        const full = h0 / H >= SNAP[2] - 0.03, dy = y - y0;
        if (Math.abs(dy) < 6) return;
        if ((dy < 0 && !full) || (dy > 0 && el.scrollTop <= 0)) { dragging = true; y0 = y; h0 = $('panel').offsetHeight; $('panel').style.transition = 'none'; }
        else { y0 = null; return; }                        // scroll normal de la lista
      }
      if (!isList && moved < 8) return;                 // un toque normal (tocar el buscador o un boton) sigue funcionando
      if (e.cancelable) e.preventDefault();
      if (document.activeElement === $('qAddr') && !isList) $('qAddr').blur();
      if (!raf) raf = requestAnimationFrame(apply);
    }, { passive: false });
    const end = () => {
      if (y0 == null) return;
      y0 = null;
      if (!dragging) return;
      dragging = false;
      $('panel').style.transition = '';
      const f = $('panel').offsetHeight / H;
      if (moved < 8) { if (tapToggle) setSheet(f < 0.45 ? SNAP[1] : (f > 0.8 ? SNAP[1] : SNAP[2])); return; }
      let target;
      if (vel < -0.4) target = SNAP.find(x => x > f + 0.02) ?? SNAP[2];          // empujon hacia arriba
      else if (vel > 0.4) target = [...SNAP].reverse().find(x => x < f - 0.02) ?? SNAP[0];   // hacia abajo
      else target = SNAP.reduce((a, b) => Math.abs(b - f) < Math.abs(a - f) ? b : a);
      setSheet(target);
    };
    el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
  }

  // ---------- Trazado por calles (base \u2192 paradas \u2192 base) ----------
  const geoTimers = {};
  function refreshGeometry(r, wait = 600) {
    clearTimeout(geoTimers[r.id]);
    geoTimers[r.id] = setTimeout(async () => {
      const c = ctx(r), pts = [c.depot, ...r.stops];
      if (c.back && r.stops.length) pts.push(c.depot);
      if (pts.length < 2) { r.geometry = null; saveLocal(); if (curId === r.id && view === 'route') renderMap(r); return; }
      try {
        const coords = pts.map(p => p.lng.toFixed(6) + ',' + p.lat.toFixed(6)).join(';');
        const d = await fetchJson(`${OSRM}/route/v1/driving/${coords}?overview=simplified&geometries=geojson`, 10000);
        if (d.code !== 'Ok') throw 0;
        r.geometry = d.routes[0].geometry.coordinates.map(([lng, lat]) => [+lat.toFixed(5), +lng.toFixed(5)]);
        saveLocal();
        if (curId === r.id && view === 'route') renderMap(r);
      } catch { /* sin conexi\u00f3n: l\u00ednea recta */ }
    }, wait);
  }

  // ---------- Mapa (Leaflet + OpenStreetMap) ----------
  let map = null, tiles = null, layer = null, meMarker = null;
  const TILE = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
  function ensureMap() {
    if (!window.L) return false;
    if (!map) {
      map = L.map('map', { zoomControl: false, fadeAnimation: false, markerZoomAnimation: false }).setView([-33.45, -70.62], 12);
      tiles = L.tileLayer(TILE, { maxZoom: 19, attribution: '\u00a9 OpenStreetMap', keepBuffer: 4, updateWhenZooming: false, updateWhenIdle: true }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    if (!ui.mapSized) { ui.mapSized = true; setTimeout(() => map.invalidateSize(), 0); }
    return true;
  }
  const numIcon = (n, color, big) => {
    const sz = big ? 40 : 32;
    return L.divIcon({ className: '', iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2],
      html: `<div class="pin-num" style="width:${sz}px;height:${sz}px;background:${color};color:${color === COLOR.priority ? '#111827' : '#fff'};font-size:${big ? 16 : 13}px">${n}</div>` });
  };
  const depotIcon = () => L.divIcon({ className: '', iconSize: [34, 34], iconAnchor: [17, 17],
    html: '<div class="pin-num" style="width:34px;height:34px;border-radius:9px;background:#111827;color:#fff;font-size:16px">\ud83c\udfe0</div>' });
  function renderMap(r) {
    if (!window.L) return;
    // Si nada del mapa cambio, no se redibuja (esto era lo que mas demoraba)
    const sig = [r.id, isDark(), ui.activeId, r.start.lat, r.start.lng, r.returnToStart, r.geometry ? r.geometry.length + ':' + r.geometry[0] : 0,
      ...r.stops.map(s => s.id + s.status + s.lat + s.lng + (s.priority || ''))].join('|');
    if (map && sig === ui.mapSig && ui.fitKey === r.id + ':' + r.stops.length) return;
    if (!ensureMap()) return;
    ui.mapSig = sig;
    layer.clearLayers();
    const color = isDark() ? '#60a5fa' : '#1d4ed8', depot = [r.start.lat, r.start.lng];
    if (r.geometry && r.geometry.length > 1) L.polyline(r.geometry, { color, weight: 5, opacity: .85 }).addTo(layer);
    else if (r.stops.length) {
      const pts = [depot, ...r.stops.map(s => [s.lat, s.lng])];
      if (r.returnToStart !== false) pts.push(depot);
      L.polyline(pts, { color, weight: 3, opacity: .6, dashArray: '7 7' }).addTo(layer);
    }
    L.marker(depot, { icon: depotIcon(), zIndexOffset: -100 }).bindTooltip('Base: ' + fullAddress(r.start)).addTo(layer);
    r.stops.forEach((s, i) => {
      const mk = L.marker([s.lat, s.lng], { icon: numIcon(i + 1, pinColor(s), s.id === ui.activeId), zIndexOffset: s.id === ui.activeId ? 1000 : (s.status === 'pending' ? 100 : 0) });

  const addressField = (idp, value, placeholder) => `<div class="relative"><div class="flex gap-2">
      <input id="${idp}Addr" class="${INPUT}" placeholder="${placeholder}" autocomplete="off" value="${esc(value)}">
      <button id="${idp}Mic" type="button" aria-label="Dictar direcci\u00f3n" class="hidden h-12 w-12 shrink-0 rounded-xl border-2 border-slate-300 text-xl dark:border-slate-700">\ud83c\udfa4</button></div>
      <ul id="${idp}Sugg" class="mt-1 hidden divide-y divide-slate-200 overflow-hidden rounded-xl border-2 border-blue-500 bg-white dark:divide-slate-800 dark:bg-slate-900"></ul></div>`;
  // Conecta un campo de direcci\u00f3n con sugerencias mientras escribes y dictado por voz
  // ---------- Mis lugares (clientes / locales guardados por nombre, como en Spoke o Waze) ----------
  // Se guardan solos cuando una parada tiene "Cliente / local". Al escribir el nombre, salen primero con \u2b50.
  const placesList = () => (prefs.places = prefs.places || []);
  // Coincidencia: cada palabra escrita debe estar; los numeros deben calzar exacto ("741" no calza con "1741")
  function tokMatch(q, hay) {
    const toks = norm(q).split(/[\s,]+/).filter(Boolean);
    if (!toks.length) return false;
    const words = norm(hay).split(/[\s,]+/);
    return toks.every(t => /^\d+[a-z]?$/.test(t) ? words.includes(t) : (t.length > 1 && norm(hay).includes(t)));
  }
  function matchPlaces(q) {
    return placesList().filter(pl => tokMatch(q, `${pl.name} ${pl.address} ${pl.comuna}`))
      .slice(0, 6).map(pl => ({ line: pl.address, place: pl.name, placeName: pl.name, comuna: pl.comuna, lat: pl.lat, lng: pl.lng, pinManual: !!pl.pinManual, exact: true, mine: true }));
  }
  // Direcciones usadas antes en cualquier ruta (como Spoke: escribes "741" y sale "Franklin 741")
  function matchHistory(q, skip) {
    const seen = new Set(skip), out = [];
    const all = Object.values(routes).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    for (const r of all) for (const st of r.stops) {
      if (st.lat == null || !st.precise) continue;
      const key = norm(st.address + '|' + (st.customerName || ''));
      if (seen.has(key) || !tokMatch(q, `${st.customerName || ''} ${st.address} ${st.comuna || ''}`)) continue;
      seen.add(key);
      out.push({ line: st.address, place: st.customerName || '', placeName: st.customerName || '', comuna: st.comuna, lat: st.lat, lng: st.lng, pinManual: !!st.pinManual, exact: true, mine: true, hist: true });
      if (out.length >= 6) return out;
    }
    return out;
  }
  function savePlace(name, st) {
    if (!name || !st.address || st.lat == null) return;
    const list = placesList(), key = norm(name) + '|' + norm(st.address);
    const old = list.find(pl => norm(pl.name) + '|' + norm(pl.address) === key);
    const data = { name, address: st.address, comuna: st.comuna || '', lat: st.lat, lng: st.lng, phone: st.customerPhone || '', pinManual: !!st.pinManual };
    if (old) Object.assign(old, data); else list.push({ id: uid(), ...data });
    saveLocal();
  }
  function wireAddress(idp, onPick, onType, extraRow) {
    const input = $(idp + 'Addr'), list = $(idp + 'Sugg');
    let timer, ctrl, results = [];
    const show = html => { list.innerHTML = html; list.classList.toggle('hidden', !html); };
    input.addEventListener('input', () => {
      onType && onType();
      clearTimeout(timer); ctrl && ctrl.abort();
      const q = input.value.trim();
      if (q.length < 3) { show(''); return; }
      timer = setTimeout(async () => {
        ctrl = new AbortController();
        show('<li class="px-3 py-3 text-sm text-slate-500">Buscando\u2026</li>');
        const fav = matchPlaces(q);
        const mine = [...fav, ...matchHistory(q, fav.map(m => norm(m.line + '|' + m.placeName)))];
        // Paradas de la ruta que coinciden (solo en la barra de arriba), como Spoke
        const toks = norm(q).split(/\s+/).filter(Boolean);
        const inRoute = idp === 'q' && cur() ? cur().stops.filter(st => toks.every(t => norm(stopLabel(st)).includes(t))) : [];
        const routeHtml = inRoute.length ? `<li class="bg-slate-50 px-3 py-1.5 text-xs font-bold uppercase text-slate-500 dark:bg-slate-800">En esta ruta (${inRoute.length})</li>` +
          inRoute.map(st => `<li><button type="button" data-stop="${st.id}" class="w-full px-3 py-2.5 text-left"><span class="block font-semibold">${cur().stops.indexOf(st) + 1}. ${esc(stopTitle(st))}</span>
            <span class="block text-sm text-slate-500">${esc(stopSub(st))}${st.notes ? ' \u00b7 \ud83d\udcdd ' + esc(st.notes) : ''}</span></button></li>`).join('') +
          '<li class="bg-slate-50 px-3 py-1.5 text-xs font-bold uppercase text-slate-500 dark:bg-slate-800">Agregar una nueva parada</li>' : '';
        const show0 = show; const showR = html => show0(routeHtml + html);
        const item = (r, i) => r.mine
          ? `<li><button type="button" data-i="${i}" class="w-full bg-amber-50 px-3 py-3 text-left active:bg-amber-100 dark:bg-amber-950">
              <span class="block font-semibold">${r.hist ? '\ud83d\udd58' : '\u2b50'} ${esc(r.placeName || r.line)}</span>
              <span class="block text-sm text-slate-600 dark:text-slate-300">${esc((r.placeName ? [r.line, r.comuna] : [r.comuna]).filter(Boolean).join(', '))}${r.hist ? ' \u00b7 usada antes' : ''}</span></button></li>`
          : `<li><button type="button" data-i="${i}" class="w-full px-3 py-3 text-left active:bg-blue-50 dark:active:bg-slate-800">
              <span class="block font-semibold">${r.place ? '\ud83c\udfea ' + esc(r.place) : '\ud83d\udccd ' + esc(r.line)}</span>
              <span class="block text-sm text-slate-500">${esc((r.place && !r.needAddr ? [r.line, r.comuna] : [r.comuna]).filter(Boolean).join(', '))}${r.exact ? '' : ' \u00b7 n\u00famero aproximado'}</span></button></li>`;
        if (mine.length || inRoute.length) { results = mine; showR(mine.map(item).join('') + '<li class="px-3 py-2 text-xs text-slate-500">Buscando m\u00e1s\u2026</li>'); }
        if (/^\d+[a-z]?$/i.test(q)) {   // solo un numero: se buscan direcciones usadas antes con ese numero
          results = mine;
          showR(mine.map(item).join('') + `<li class="px-3 py-3 text-sm text-slate-500">${mine.length ? 'Para otra direcci\u00f3n, ' : ''}escribe tambi\u00e9n la calle: ej. "${esc(q)} franklin"</li>` + (extraRow ? extraRow(q) : ''));
          return;
        }
        try {
          const api = await searchAddress(q, ctrl.signal);
          const seen = new Set(mine.map(m => norm(m.line)));
          results = [...mine, ...api.filter(a => !seen.has(norm(a.line)))];
          showR((results.length ? results.map(item).join('')
            : '<li class="px-3 py-3 text-sm text-slate-500">No encontr\u00e9 esa direcci\u00f3n. Prueba solo con el nombre de la calle (sin \u00abAv\u00bb).</li>') + (extraRow ? extraRow(q) : ''));
        } catch (e) { if (e.name !== 'AbortError') showR(mine.map(item).join('') + '<li class="px-3 py-3 text-sm text-slate-500">Sin conexi\u00f3n para buscar m\u00e1s.</li>' + (extraRow ? extraRow(q) : '')); }

        input.value = r.place + '\u2026';

        } catch { mic.textContent = '\ud83c\udfa4'; }

    }
    return { show };
  }

        <label class="${LABEL}">Tel\u00e9fono (para avisar por WhatsApp)<input id="fPhone" class="${INPUT} mt-1" inputmode="tel" placeholder="+56 9 1234 5678" value="${v('customerPhone')}"></label>

        <label class="${LABEL}">Prioridad<select id="fPri" class="${INPUT} mt-1"><option value="normal">Normal</option><option value="first">Primera (ir al comienzo)</option><option value="last">\u00daltima (dejar para el final)</option></select></label>
        <label class="${LABEL}">Ubicaci\u00f3n en el veh\u00edculo<input id="fPos" class="${INPUT} mt-1" placeholder="Ej: atr\u00e1s derecha" value="${v('vehiclePosition')}"></label>
        <label class="${LABEL}">Paquete<input id="fPkg" class="${INPUT} mt-1" placeholder="Ej: 2 cajas, caja caf\u00e9" value="${v('packageInfo')}"></label>
      </div>
      <p id="fErr" class="mt-2 hidden text-sm font-semibold text-red-600"></p>
      <button id="fSave" class="mt-4 h-16 w-full rounded-2xl bg-blue-600 text-lg font-bold text-white">${s ? 'Guardar cambios' : 'Agregar parada'}</button>

    $('fPri').value = s ? (s.priority || 'normal') : 'normal';
    wireChips();
    let pinMarker = null;
    function showMini() {
      if (!pick || !window.L) return;
      $('fMapBox').classList.remove('hidden');
      if (!miniMap) {
        miniMap = L.map('fMap', { zoomControl: false, attributionControl: false });
        L.tileLayer(TILE, { maxZoom: 19 }).addTo(miniMap);
        miniMap.on('click', e => { pick = { lat: e.latlng.lat, lng: e.latlng.lng, precise: true, manual: true }; pinMarker.setLatLng(e.latlng); });
      }
      miniMap.setView([pick.lat, pick.lng], 17);
      if (!pinMarker) {
        pinMarker = L.marker([pick.lat, pick.lng], { draggable: true, icon: L.divIcon({ className: '', iconSize: [34, 44], iconAnchor: [17, 42], html: '<svg width="34" height="44" viewBox="0 0 34 44"><path d="M17 1C8 1 1 8 1 17c0 12 16 26 16 26s16-14 16-26C33 8 26 1 17 1z" fill="#dc2626" stroke="#fff" stroke-width="2"/><circle cx="17" cy="17" r="6" fill="#fff"/></svg>' }) }).addTo(miniMap);
        pinMarker.on('dragend', () => { const ll = pinMarker.getLatLng(); pick = { lat: ll.lat, lng: ll.lng, precise: true, manual: true }; });
      } else pinMarker.setLatLng([pick.lat, pick.lng]);
      setTimeout(() => miniMap && miniMap.invalidateSize(), 50);
    }
    wireAddress('f', p => { pick = { lat: p.lat, lng: p.lng, precise: true, manual: !!p.pinManual }; setComunaSelect($('fComuna'), p.comuna); if (!$('fName').value.trim() && p.place) $('fName').value = p.place; showMini(); },
      () => { pick = null; $('fMapBox').classList.add('hidden'); });
    if ((s && s.precise) || prefill) showMini();
    if (!s && !prefill) setTimeout(() => $('fAddr')?.focus(), 80);

    const save = more => {
      const address = $('fAddr').value.trim(), comuna = $('fComuna').value;
      if (!address) { $('fErr').textContent = 'Falta la direcci\u00f3n.'; $('fErr').classList.remove('hidden'); return; }
      let lat, lng, precise;
      if (pick) ({ lat, lng, precise } = pick);
      else if (comuna && COMUNA[comuna]) { lat = COMUNA[comuna].lat; lng = COMUNA[comuna].lng; precise = false; }
      else { $('fErr').textContent = 'Elige la direcci\u00f3n de la lista, o al menos la comuna.'; $('fErr').classList.remove('hidden'); return; }
      const pinManual = !!(pick && pick.manual) || (!!s && s.pinManual && !!pick && s.lat === pick.lat && s.lng === pick.lng);
      const data = { address, comuna, lat, lng, precise, pinManual, notes: $('fNotes').value.trim(), customerName: $('fName').value.trim(), customerPhone: $('fPhone').value.trim(),
        timeWindowStart: $('fWs').value || '', timeWindowEnd: $('fWe').value || '', priority: $('fPri').value, vehiclePosition: $('fPos').value.trim(), packageInfo: $('fPkg').value.trim() };
      if (done) {
        if ($('fPlan').value) data.plannedMin = toMin($('fPlan').value);
        if ($('fReal').value) data.doneMin = toMin($('fReal').value);
      }
      const moved = s && (s.lat !== lat || s.lng !== lng);
      if (s) Object.assign(s, data); else r.stops.push({ id: uid(), status: 'pending', ...data });
      if ($('fKeep').checked && data.customerName && data.precise) savePlace(data.customerName, data);
      changed(r, { keepOptimized: !!s && !moved });
      if (!s || moved) ensureMatrix(r).then(() => { if (curId === r.id) render(); });
      render();
      if (more) { openStopForm(); toast('Parada agregada. Escribe la siguiente.'); } else { closeModal(); toast(s ? 'Parada actualizada' : 'Parada agregada'); }
    };
    $('fSave').onclick = () => save(false);
    if (!s) $('fMore').onclick = () => save(true);
  }

  // ---------- FOTOS de respaldo (se guardan en el telefono, en IndexedDB, y se borran solas a los 30 dias) ----------
  const PHOTO_DAYS = 30;
  let photoDbP = null;
  const photoDb = () => photoDbP || (photoDbP = new Promise((res, rej) => {
    const rq = indexedDB.open('ruta-enrique-fotos', 1);
    rq.onupgradeneeded = () => rq.result.createObjectStore('photos', { keyPath: 'id' });
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  }));
  async function photoTx(mode, fn) {
    const db = await photoDb();
    return new Promise((res, rej) => { const tx = db.transaction('photos', mode); const out = fn(tx.objectStore('photos')); tx.oncomplete = () => res(out && out.result); tx.onerror = () => rej(tx.error); });
  }
  // Achica la foto (max 1280 px, JPEG) para que no llene el telefono
  async function compressPhoto(file) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      return await new Promise(res => c.toBlob(b => res(b || file), 'image/jpeg', 0.72));
    } catch { return file; } finally { URL.revokeObjectURL(url); }
  }
  async function addPhoto(r, s, file) {
    const blob = await compressPhoto(file), id = uid();
    await photoTx('readwrite', st => st.put({ id, routeId: r.id, stopId: s.id, at: Date.now(), blob }));
    s.photos = [...(s.photos || []), id]; saveLocal();
    return id;
  }
  const getPhoto = id => photoTx('readonly', st => st.get(id)).then(x => x || null).catch(() => null);
  async function deletePhoto(s, id) { try { await photoTx('readwrite', st => st.delete(id)); } catch {} s.photos = (s.photos || []).filter(x => x !== id); saveLocal(); }
  // Limpieza: borra fotos con mas de 30 dias y quita sus referencias
  async function cleanupPhotos() {
    try {
      const limit = Date.now() - PHOTO_DAYS * 864e5, gone = new Set();
      const all = await photoTx('readonly', st => st.getAll());
      for (const ph of all || []) if (ph.at < limit) gone.add(ph.id);
      if (gone.size) await photoTx('readwrite', st => gone.forEach(id => st.delete(id)));
      const alive = new Set((all || []).map(p => p.id).filter(id => !gone.has(id)));
      let dirty = false;
      for (const r of Object.values(routes)) for (const st of r.stops) if (st.photos?.length) {
        const keep = st.photos.filter(id => alive.has(id)); if (keep.length !== st.photos.length) { st.photos = keep; dirty = true; }
      }
      if (dirty) { saveLocal(); if (view === 'route' && cur()) render(); }
    } catch {}
  }
  // Ver una foto en grande, compartirla (WhatsApp, galeria) o borrarla
  async function viewPhoto(s, id, after) {
    const ph = await getPhoto(id); if (!ph) return toast('La foto ya no est\u00e1 (se borran a los 30 d\u00edas).');
    const url = URL.createObjectURL(ph.blob), d = new Date(ph.at);
    const ov = document.createElement('div');
    ov.className = 'fixed inset-0 z-[6000] flex flex-col bg-black';
    ov.innerHTML = `<div class="flex items-center gap-2 p-3 text-white" style="padding-top:max(env(safe-area-inset-top),12px)">
        <button data-x class="h-11 rounded-xl bg-white/15 px-4 font-bold">\u2039 Volver</button>
        <span class="flex-1 truncate text-sm">${esc(stopTitle(s))} \u00b7 ${d.toLocaleDateString('es-CL')} ${hhmm(d.getHours() * 60 + d.getMinutes())}</span></div>
      <img src="${url}" class="min-h-0 flex-1 object-contain" alt="Foto de respaldo">
      <div class="grid grid-cols-2 gap-2 p-3" style="padding-bottom:max(env(safe-area-inset-bottom),12px)">
        <button data-share class="h-12 rounded-xl bg-blue-600 font-bold text-white">\u2197 Compartir / guardar</button>
        <button data-del class="h-12 rounded-xl bg-red-600 font-bold text-white">\ud83d\uddd1 Borrar foto</button></div>`;
    document.body.appendChild(ov);
    const close = () => { ov.remove(); URL.revokeObjectURL(url); };
    ov.querySelector('[data-x]').onclick = close;
    ov.querySelector('[data-share]').onclick = async () => {
      const f = new File([ph.blob], `foto-${norm(stopTitle(s)).replace(/[^a-z0-9]+/g, '-')}-${d.toISOString().slice(0, 10)}.jpg`, { type: 'image/jpeg' });
      try { if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: stopTitle(s) }); return; } } catch (e) { if (e.name === 'AbortError') return; }
      const a = document.createElement('a'); a.href = url; a.download = f.name; a.click();
    };
    let sure = false;
    ov.querySelector('[data-del]').onclick = async e => {
      if (!sure) { sure = true; e.target.textContent = '\u00bfSeguro? Toca otra vez'; return; }
      await deletePhoto(s, id); close(); after && after(); toast('Foto borrada');
    };
  }
  // Tira de fotos (miniaturas + boton camara) dentro de un contenedor
  async function paintPhotoStrip(boxId, r, s) {
    const box = $(boxId); if (!box) return;
    const ids = s.photos || [];
    box.innerHTML = `<div class="flex flex-wrap gap-2">${ids.map(id => `<button type="button" data-ph="${id}" class="h-20 w-20 overflow-hidden rounded-xl border-2 border-slate-200 bg-slate-100 dark:border-slate-700 dark:bg-slate-800"></button>`).join('')}
      <label class="grid h-20 w-20 cursor-pointer place-items-center rounded-xl border-2 border-dashed border-slate-300 text-center text-xs font-bold text-slate-500 dark:border-slate-700">\ud83d\udcf7<span>Agregar foto</span>
        <input type="file" accept="image/*" capture="environment" class="hidden" data-addph></label></div>
      <p class="mt-1 text-xs text-slate-500">Respaldo en el tel\u00e9fono. Se borran solas a los ${PHOTO_DAYS} d\u00edas.</p>`;
    for (const id of ids) {
      const ph = await getPhoto(id), b = box.querySelector(`[data-ph="${id}"]`);
      if (b && ph) b.innerHTML = `<img src="${URL.createObjectURL(ph.blob)}" class="h-full w-full object-cover" alt="">`;
      if (b) b.onclick = () => viewPhoto(s, id, () => { paintPhotoStrip(boxId, r, s); render(); });
    }
    box.querySelector('[data-addph]').onchange = async e => {
      const f = e.target.files?.[0]; if (!f) return;
      toast('Guardando foto\u2026');
      try { await addPhoto(r, s, f); toast('Foto guardada'); } catch { toast('No se pudo guardar la foto'); }
      paintPhotoStrip(boxId, r, s); render();
    };
  }

      <div class="mt-4"><label class="${LABEL}" for="ssNotes">\ud83d\udcdd Notas (qu\u00e9 hacer en esta parada)</label>

      <div class="mt-3"><span class="${LABEL}">\ud83d\udcf7 Fotos de respaldo</span><div id="ssPhotos" class="mt-1"></div></div>

          <button data-kind="delivery" class="h-10 rounded-lg px-4 font-bold">Entrega</button><button data-kind="pickup" class="h-10 rounded-lg px-4 font-bold">Recolecci\u00f3n</button></div></div>
      <div class="mt-3 divide-y divide-slate-200 rounded-xl border-2 border-slate-200 dark:divide-slate-800 dark:border-slate-700">
        <p class="p-3 text-sm">\ud83d\udccd ${esc(fullAddress(s))}</p>
        ${s.customerPhone ? `<a href="${waUrl(s)}" target="_blank" rel="noopener" class="block p-3 text-sm font-semibold text-emerald-700">\ud83d\udcac Avisar por WhatsApp (${esc(s.customerPhone)})</a>` : ''}
        <button id="ssEdit" class="block w-full p-3 text-left font-semibold">\u270e Editar la parada (nombre, direcci\u00f3n, horario\u2026)</button>
        <button id="ssDup" class="block w-full p-3 text-left font-semibold">\u29c9 Duplicar parada</button>

      <button id="ssSave" class="mt-4 h-14 w-full rounded-2xl bg-blue-600 text-lg font-bold text-white">Listo</button>`);
    wireChips();
    let k = kind;
    const paintKind = () => document.querySelectorAll('[data-kind]').forEach(b => { b.className = `h-10 rounded-lg px-4 font-bold ${b.dataset.kind === k ? 'bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-200' : 'text-slate-500'}`; });
    document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { k = b.dataset.kind; paintKind(); });
    paintKind();
    const keep = () => { const n = $('ssNotes').value.trim(); if (n !== (s.notes || '') || k !== kind) { s.notes = n; s.kind = k; changed(r, { keepOptimized: true }); } };
    $('ssSave').onclick = () => { keep(); closeModal(); render(); };
    if (pending) {
      $('ssOk').onclick = () => { keep(); openPod(id, 'delivered'); };
      $('ssFail').onclick = () => { keep(); openPod(id, 'failed'); };
    } else $('ssUndo').onclick = () => { resetStop(s); changed(r, { keepOptimized: true }); closeModal(); render(); };
    $('ssEdit').onclick = () => { keep(); openStopForm(id); };
    paintPhotoStrip('ssPhotos', r, s);
    $('ssDup').onclick = () => { keep(); const c = resetStop({ ...JSON.parse(JSON.stringify(s)), id: uid(), photos: [] }); r.stops.splice(idx + 1, 0, c); changed(r); closeModal(); render(); toast('Parada duplicada'); };
    let sure = false;
    $('ssDel').onclick = () => {
      if (!sure) { sure = true; $('ssDel').textContent = '\u00bfSeguro? Toca otra vez para eliminar'; $('ssDel').className = 'block w-full bg-red-600 p-3 text-left font-bold text-white'; return; }

    };

  }

  // ---------- Copiar paradas de una ruta anterior ----------
  function openCopyFrom() {

  // ---------- Prueba de entrega ----------
  const REASONS = [['cliente_ausente', 'Cliente ausente'], ['direccion_erronea', 'Direcci\u00f3n err\u00f3nea'], ['rechazado', 'Rechazado'], ['acceso_cerrado', 'Acceso cerrado'], ['otro', 'Otro motivo']];
  function openPod(id, startMode = 'delivered') {
    const r = cur(), s = r.stops.find(x => x.id === id);
    let mode = startMode, reason = null, hasPhoto = false, sigReady = false, sigDirty = false, podFile = null;
    sheet(`${head('Prueba de entrega')}
      <p class="-mt-2 mb-3 truncate text-sm text-slate-600 dark:text-slate-400">${esc(stopLabel(s))}</p>
      <div class="mb-4 grid grid-cols-2 gap-2"><button id="mOk" class="h-14 rounded-xl text-lg font-bold">Entregada</button><button id="mFail" class="h-14 rounded-xl text-lg font-bold">No entregada</button></div>

        <div><div class="mb-1 flex items-center justify-between"><span class="text-sm font-semibold">Firma del cliente</span><button id="sigClear" class="text-sm font-semibold text-slate-500">Borrar</button></div>
          <canvas id="sig" class="h-40 w-full touch-none rounded-xl border-2 border-slate-300 bg-white"></canvas></div>
        <input id="recipient" class="${INPUT}" placeholder="\u00bfQui\u00e9n recibi\u00f3? (opcional)">
      </div>
      <div id="failPane" class="hidden grid grid-cols-2 gap-2">${REASONS.map(([k, l]) => `<button data-reason="${k}" class="h-14 rounded-xl border-2 border-slate-200 font-semibold dark:border-slate-700">${l}</button>`).join('')}</div>
      <textarea id="note" rows="2" class="mt-3 w-full rounded-xl border-2 border-slate-300 bg-transparent p-3 dark:border-slate-700" placeholder="Nota (ej. dejado en conserjer\u00eda)"></textarea>
      <button id="pSave" class="mt-3 h-16 w-full rounded-2xl text-lg font-bold text-white disabled:opacity-50"></button>`);
    function setupSig() {
      if (sigReady) return;
      const c = $('sig'); if (!c || !c.clientWidth) return;
      const ratio = window.devicePixelRatio || 1;
      c.width = c.clientWidth * ratio; c.height = c.clientHeight * ratio;
      const g = c.getContext('2d'); g.scale(ratio, ratio); g.lineWidth = 2.5; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111827';
      let drawing = false;
      const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
      c.addEventListener('pointerdown', e => { drawing = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); g.beginPath(); g.moveTo(x, y); });
      c.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pos(e); g.lineTo(x, y); g.stroke(); sigDirty = true; });
      c.addEventListener('pointerup', () => { drawing = false; });
      $('sigClear').onclick = () => { g.clearRect(0, 0, c.width, c.height); sigDirty = false; };
      sigReady = true;
    }
    const paint = () => {
      $('mOk').className = `h-14 rounded-xl text-lg font-bold ${mode === 'delivered' ? 'bg-green-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}`;

      const btn = $('pSave');
      btn.className = `mt-3 h-16 w-full rounded-2xl text-lg font-bold text-white disabled:opacity-50 ${mode === 'delivered' ? 'bg-green-600' : 'bg-red-600'}`;
      btn.textContent = mode === 'delivered' ? 'Confirmar entrega' : 'Marcar como no entregada';
      btn.disabled = mode === 'failed' && !reason;
      if (mode === 'delivered') setupSig();
    };
    $('mOk').onclick = () => { mode = 'delivered'; paint(); };
    $('mFail').onclick = () => { mode = 'failed'; paint(); };
    document.querySelectorAll('[data-reason]').forEach(b => b.onclick = () => { reason = b.dataset.reason; paint(); });
    $('photo').onchange = e => { const f = e.target.files?.[0]; if (!f) return; hasPhoto = true; podFile = f; $('preview').src = URL.createObjectURL(f); $('preview').classList.remove('hidden'); $('photoLbl').textContent = 'Cambiar foto'; };

      changed(r, { keepOptimized: true }); closeModal(); ui.activeId = null; render();
      toast(mode === 'delivered' ? 'Entrega guardada' : 'Marcada como no entregada');
    };
    paint();
  }

  // =====================================================================
  // 9) HOJA DEL D\u00cdA (vista previa + imprimir / guardar PDF)
  // =====================================================================
  function buildSheet(r) {
    const t = totals(r), units = prefs.units;
    const cell = (real, est) => real == null ? '' : `${hhmm(real)}${est != null ? ` <span class="${devClass(real, est)}">(${devText(real, est)})</span>` : ''}`;
    const rows = [];
    const st0 = toMin(r.startTime), out0 = r.load ? r.load.min : null;
    rows.push({ n: '', addr: fullAddress(r.start), est: out0 != null && Math.abs(out0 - st0) > 90 ? out0 : st0, real: out0, notes: (r.load && r.load.note) || 'Punto de salida' });
    r.stops.forEach((s, i) => {
      const est = s.status === 'pending' ? s.etaMin : (s.plannedMin ?? s.etaMin);
      const extra = s.status === 'failed' ? `No entregada: ${s.pod?.reasonLabel || ''}` : '';
      const notes = [s.kind === 'pickup' ? 'Recolecci\u00f3n' : '', s.notes, extra, s.pod?.note, s.photos?.length ? `${s.photos.length} foto${s.photos.length > 1 ? 's' : ''}` : ''].filter(Boolean).join(' \u00b7 ');
      rows.push({ n: i + 1, addr: stopLabel(s), est, real: s.status !== 'pending' ? s.doneMin : null, notes });
    });
    if (r.returnToStart !== false && r.stops.length) rows.push({ n: '', addr: fullAddress(r.start), est: t.endEst, real: t.endReal, notes: 'Punto de llegada' });
    $('printArea').innerHTML = `<div class="sheet-page">
      <h1>${esc(sheetDate(r.date))} - Ruta Enrique</h1>
      <p class="sub">Tiempo total: ${fmtDur(t.durMin)} &nbsp; Distancia total: ${fmtDist(t.km, units)} &nbsp; Paradas: ${r.stops.length}</p>
      <p class="route-name">${r.name ? esc(r.name) + ' \u00b7 ' : ''}Base: ${esc(fullAddress(r.start))}</p>
      <table class="sheet-table"><thead><tr><th>#</th><th>Direcci\u00f3n</th><th>Hora estimada</th><th>Hora real</th><th>Notas</th></tr></thead>
      <tbody>${rows.map(x => `<tr><td class="num">${x.n}</td><td>${esc(x.addr)}</td><td>${x.est != null ? hhmm(x.est) : ''}</td><td>${cell(x.real, x.est)}</td><td>${esc(x.notes || '')}</td></tr>`).join('')}</tbody></table>
      <p class="sheet-foot">Generado el ${new Date().toLocaleString('es-CL')} \u00b7 ${M(r).real ? 'distancias por calle (OpenStreetMap)' : 'distancias estimadas'}</p></div>`;
  }
  function openSheet() {
    const r = cur(); if (!r) return;
    $('sheetUnits').value = prefs.units;
    buildSheet(r);
    $('sheetView').classList.add('open');
    $('sheetView').scrollTop = 0;
  }

  // =====================================================================
  // 10) ACCIONES DE LA RUTA (men\u00fa \u22ee)
  // =====================================================================
  function openMenu() {
    const items = [
      ['share', '\ud83d\udd17', 'Compartir copia de la ruta'], ['transfer', '\u2195', 'Transferir paradas a otra ruta'], ['copy', '\ud83d\udccb', 'Copiar paradas al portapapeles'],
      ['reopt', '\ud83d\udd04', 'Volver a optimizar la ruta'], ['scan', '\ud83d\udcf7', 'Escanear manifiesto de ruta'], ['import', '\ud83d\udcc4', 'Importar manifiesto de ruta'],
      ['print', '\ud83d\udda8', 'Imprimir ruta / Hoja del d\u00eda (PDF)'], ['delete', '\ud83d\uddd1', 'Eliminar paradas\u2026'], ['deleteAll', '\u26d4', 'Eliminar TODAS las paradas'],
    ];

      ${items.map(([k, i, l]) => `<button data-menu="${k}" class="flex w-full items-center gap-4 py-4 text-left text-lg font-semibold ${k.startsWith('delete') ? 'text-red-600' : ''}"><span class="w-8 text-center text-2xl">${i}</span>${l}</button>`).join('')}</div>`);

  async function menuAction(k) {

    if (k === 'transfer') { ui.select = { mode: 'transfer', ids: new Set() }; return render(); }
    if (k === 'copy') return copyStops(r);
    if (k === 'reopt') return reoptimize();

    if (k === 'import') return openImport(false);

  }
  const routeText = r => {
    const t = totals(r);
    return [`${sheetDate(r.date)}${r.name ? ' \u00b7 ' + r.name : ''}`, `Base: ${fullAddress(r.start)}`, `${r.stops.length} paradas \u00b7 ${fmtDist(t.km)} \u00b7 ${fmtDur(t.durMin)}`, '',
      ...r.stops.map((s, i) => `${i + 1}. ${stopLabel(s)}${s.etaMin != null && s.status === 'pending' ? ` (${hhmm(s.etaMin)})` : ''}${s.notes ? ' \u2014 ' + s.notes : ''}`)].join('\n');
  };
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch {
      sheet(`${head('Copiar paradas')}<p class="mb-2 text-sm text-slate-500">Mant\u00e9n apretado el texto, toca "Seleccionar todo" y luego "Copiar".</p>
        <textarea rows="10" class="w-full rounded-xl border-2 border-slate-300 bg-transparent p-3 text-sm dark:border-slate-700">${esc(text)}</textarea>`);
      return false;
    }
  }
  async function copyStops(r) { if (await copyText(routeText(r))) toast('Paradas copiadas. P\u00e9galas en WhatsApp o donde quieras.'); }
  async function shareRoute(r) {
    const copy = JSON.parse(JSON.stringify(r)); delete copy.geometry;
    const json = JSON.stringify({ app: 'ruta-enrique', v: 1, route: copy });
    const fname = `ruta-${r.date}-${norm(titleOf(r)).replace(/[^a-z0-9]+/g, '-')}.json`;
    try {
      const file = new File([json], fname, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ title: titleOf(r), text: routeText(r), files: [file] }); return; }
      if (navigator.share) { await navigator.share({ title: titleOf(r), text: routeText(r) }); return; }
    } catch (e) { if (e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' })); a.download = fname; a.click();
    if (await copyText(routeText(r))) toast('Copia descargada y texto copiado al portapapeles');
  }
  // Actualizar (como Spoke): recalcula horas y trayecto desde donde estas, SIN cambiar el orden

    const r = cur(), f = $('routeFooter');
    f.innerHTML = '<div class="flex h-14 items-center justify-center text-base font-bold">\u21bb Actualizando horas\u2026</div>';
    let gpsOk = false;
    if (r.date === dayStr(0) && (r.load || r.stops.some(s => s.status !== 'pending'))) {
      const pos = await myPosition();
      if (pos) { r.here = { lat: pos.lat, lng: pos.lng, min: nowMin() }; gpsOk = true; }
    }
    await ensureMatrix(r);
    changed(r, { keepOptimized: true }); render();
    toast('Horas actualizadas' + (gpsOk ? ' desde tu ubicaci\u00f3n actual' : '') + ' (sin cambiar el orden)');
  }
  async function reoptimize() {
    const r = cur(); if (r.stops.filter(s => s.status === 'pending').length < 2) return toast('Hacen falta al menos 2 paradas pendientes');
    const f = $('routeFooter');
    // Si la ruta ya empez\u00f3 hoy (salida marcada o alguna entrega), ordena desde donde est\u00e1s ahora (GPS)
    let gpsOk = false;
    const started = r.date === dayStr(0) && (r.load || r.stops.some(s => s.status !== 'pending'));
    if (started) {
      f.innerHTML = '<div class="flex h-16 items-center justify-center text-lg font-bold">\ud83d\udccd Buscando tu ubicaci\u00f3n\u2026</div>';
      const pos = await myPosition();
      if (pos) { r.here = { lat: pos.lat, lng: pos.lng, min: nowMin() }; gpsOk = true; }
    }
    f.innerHTML = '<div class="flex h-16 items-center justify-center text-lg font-bold">Calculando rutas por calle\u2026</div>';
    const m = await ensureMatrix(r), before = schedule(r).km;
    optimize(r, m); changed(r, { keepOptimized: true }); render();
    const saved = before - schedule(r).km;
    toast((saved > 0.5 ? `Ruta optimizada: ${fmtDist(saved)} menos` : 'Ruta optimizada') + (gpsOk ? ' desde tu ubicaci\u00f3n actual' : (started ? ' (sin GPS: desde tu \u00faltima entrega)' : '')) + (m.real ? '' : ' (sin conexi\u00f3n: distancias estimadas)'));
  }
  function openDeleteMenu(r) {

      <button id="dSel" class="h-14 w-full rounded-xl border-2 border-slate-300 text-left px-4 font-bold dark:border-slate-700">\u2611 Elegir cu\u00e1les eliminar</button>
      <button id="dDone" ${done ? '' : 'disabled'} class="h-14 w-full rounded-xl border-2 border-slate-300 px-4 text-left font-bold disabled:opacity-50 dark:border-slate-700">\u2714 Eliminar las ${done} completadas</button>
      <button id="dAll" class="h-14 w-full rounded-xl border-2 border-red-600 px-4 text-left font-bold text-red-600">Eliminar todas (${r.stops.length})</button></div>`);
    $('dSel').onclick = () => { closeModal(); ui.select = { mode: 'delete', ids: new Set() }; render(); };
    $('dDone').onclick = () => { r.stops = r.stops.filter(s => s.status === 'pending'); changed(r, { keepOptimized: true }); closeModal(); render(); toast('Paradas completadas eliminadas'); };
    $('dAll').onclick = () => confirmDeleteAll(r);

  function confirmDeleteAll(r) {
    sheet(`<div class="py-2 text-center"><p class="text-xl font-bold">Eliminar todas las paradas</p>

      <button id="daYes" class="mt-5 h-14 w-full rounded-2xl bg-red-600 text-lg font-bold text-white">Eliminar todas las paradas</button>
      <button data-close class="mt-2 h-12 w-full rounded-xl font-bold text-slate-600 dark:text-slate-300">Cancelar</button></div>`);
    $('daYes').onclick = () => { r.stops = []; r.endedMin = null; r.here = null; r.load = null; changed(r); closeModal(); render(); toast('Todas las paradas eliminadas'); };
  }
  function finishSelection() {
    const r = cur(), sel = ui.select; if (!sel || !sel.ids.size) return;
    if (sel.mode === 'delete') {
      r.stops = r.stops.filter(s => !sel.ids.has(s.id)); const n = sel.ids.size; ui.select = null;
      changed(r, { keepOptimized: true }); render(); return toast(`${n} parada${n === 1 ? '' : 's'} eliminada${n === 1 ? '' : 's'}`);
    }
    const others = Object.values(routes).filter(x => x.id !== r.id).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    sheet(`${head('Mover paradas a\u2026')}<div class="space-y-2">
      ${others.map(o => `<button data-to="${o.id}" class="w-full rounded-xl border-2 border-slate-200 p-3 text-left dark:border-slate-700"><b>${esc(o.name)}</b><br><span class="text-sm text-slate-500">${esc(dateLabel(o.date))} \u00b7 ${o.stops.length} paradas</span></button>`).join('')}
      <button data-to="__new" class="h-14 w-full rounded-xl bg-blue-600 font-bold text-white">+ Nueva ruta para ma\u00f1ana</button></div>`);
    document.querySelectorAll('[data-to]').forEach(b => b.onclick = () => {
      let target = routes[b.dataset.to];
      if (b.dataset.to === '__new') {
        target = { id: uid(), name: '', date: dayStr(1), startTime: prefs.defaultStartTime, start: { ...prefs.base }, returnToStart: true, stops: [], optimized: false, createdAt: Date.now(), updatedAt: Date.now() };
        routes[target.id] = target;
      }
      const moving = r.stops.filter(s => sel.ids.has(s.id));
