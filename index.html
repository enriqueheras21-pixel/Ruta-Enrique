            : `<span class="${ACTION} bg-slate-100 text-sm text-slate-400 dark:bg-slate-800">Sin teléfono</span>`}
          <button data-act="pod" data-id="${s.id}" class="${ACTION} bg-slate-900 text-white dark:bg-white dark:text-slate-900">${ICON.check} Listo</button>
        </div>` : '';
      const edits = active ? `
        <div class="mt-2 grid grid-cols-2 gap-2">
          ${pending ? `<button data-act="edit" data-id="${s.id}" class="${SMALL}">✎ Editar</button>`
                    : `<button data-act="undo" data-id="${s.id}" class="${SMALL}">↺ Deshacer</button>`}
          <button data-act="del" data-id="${s.id}" class="${SMALL} ${ui.confirmDel === s.id ? 'border-red-600 bg-red-600 text-white' : 'text-red-600'}">
            ${ui.confirmDel === s.id ? 'Toca otra vez para borrar' : '🗑 Borrar'}</button>
        </div>` : '';

      return `
      <li id="stop-${s.id}" data-id="${s.id}" data-act="select"
          class="rounded-2xl border-2 bg-white p-3 dark:bg-slate-900 ${active ? 'border-blue-500' : 'border-slate-200 dark:border-slate-800'} ${pending ? '' : 'opacity-75'}">
        <div class="flex items-start gap-2">
          <span class="handle -ml-1 grid h-12 w-8 shrink-0 cursor-grab touch-none place-items-center text-slate-400 ${pending ? '' : 'invisible'}" aria-label="Arrastrar">${ICON.grip}</span>
          <span class="grid h-10 w-10 shrink-0 place-items-center rounded-full text-base font-bold ${badge(s)}">${i + 1}</span>
          <div class="min-w-0 flex-1">
            <p class="font-semibold leading-tight">${esc(s.address)}${s.comuna ? ', ' + esc(s.comuna) : ''}</p>
            ${s.customerName ? `<p class="text-sm text-slate-600 dark:text-slate-400">${esc(s.customerName)}</p>` : ''}
            <div class="mt-1 flex flex-wrap gap-1.5 text-xs font-semibold">${chips.join('')}</div>
            ${s.notes ? `<p class="mt-1.5 rounded-lg bg-amber-50 px-2 py-1 text-sm text-amber-900 dark:bg-amber-950 dark:text-amber-200">${esc(s.notes)}</p>` : ''}
            ${status}
          </div>
        </div>
        ${actions}${edits}
      </li>`;
    }).join('');
  }

  // ---------- Mapa (Leaflet + OpenStreetMap) ----------
  let map = null, tiles = null, layer = null, meMarker = null;
  const TILE_LIGHT = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
  const TILE_DARK = TILE_LIGHT; // de noche se oscurece con CSS (no necesita clave)
  function ensureMap() {
    if (!window.L) return false;
    if (!map) {
      map = L.map('map', { zoomControl: false }).setView([-33.45, -70.65], 11);
      tiles = L.tileLayer(isDark() ? TILE_DARK : TILE_LIGHT, { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    tiles.setUrl(isDark() ? TILE_DARK : TILE_LIGHT);
    setTimeout(() => map.invalidateSize(), 0);
    return true;
  }
  const numIcon = (n, color, big) => {
    const sz = big ? 40 : 32;
    return L.divIcon({ className: '', iconSize: [sz, sz], iconAnchor: [sz / 2, sz / 2],
      html: `<div class="pin-num" style="width:${sz}px;height:${sz}px;background:${color};color:${color === COLOR.priority ? '#111827' : '#fff'};font-size:${big ? 16 : 13}px">${n}</div>` });
  };
  const depotIcon = () => L.divIcon({ className: '', iconSize: [30, 30], iconAnchor: [15, 15],
    html: '<div class="pin-num" style="width:30px;height:30px;border-radius:8px;background:#111827;color:#fff;font-size:13px">P</div>' });
  function renderMap(r) {
    if (!ensureMap()) return;
    layer.clearLayers();
    const color = isDark() ? '#60a5fa' : '#1d4ed8';
    const depot = [r.start.lat, r.start.lng];
    const pend = r.stops.filter(s => s.status === 'pending');
    if (r.geometry && r.geometry.length > 1) {
      L.polyline(r.geometry, { color, weight: 5, opacity: .85 }).addTo(layer);
    } else if (r.stops.length) {
      const pts = [depot, ...r.stops.map(s => [s.lat, s.lng])];
      if (r.returnToStart !== false) pts.push(depot);
      L.polyline(pts, { color, weight: 3, opacity: .6, dashArray: '7 7' }).addTo(layer);
    }
    L.marker(depot, { icon: depotIcon(), zIndexOffset: -100 }).addTo(layer);
    r.stops.forEach((s, i) => {
      const m = L.marker([s.lat, s.lng], { icon: numIcon(i + 1, pinColor(s), s.id === ui.activeId), zIndexOffset: s.id === ui.activeId ? 1000 : (s.status === 'pending' ? 100 : 0) });
      m.on('click', () => select(s.id, true));
      m.addTo(layer);
    });
    const key = r.id + ':' + r.stops.length;
    if (ui.fitKey !== key) {
      ui.fitKey = key;
      const all = [depot, ...r.stops.map(s => [s.lat, s.lng])];
      if (all.length > 1) map.fitBounds(all, { padding: [30, 30], maxZoom: 15 }); else map.setView(depot, 13);
    }
    void pend;
  }
  function myPosition() {
    return new Promise(res => {
      if (!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(p => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null), { enableHighAccuracy: true, timeout: 8000 });
    });
  }

  // ================= Modales =================
  const INPUT = 'h-12 w-full rounded-xl border-2 border-slate-300 bg-transparent px-3 text-base dark:border-slate-700 dark:bg-slate-900';
  const LABEL = 'block text-sm font-semibold';
  let miniMap = null;
  function closeModal() { if (miniMap) { miniMap.remove(); miniMap = null; } $('modalRoot').innerHTML = ''; }
  function sheet(inner) {
    closeModal();
    $('modalRoot').innerHTML = `
      <div id="backdrop" class="absolute inset-0 z-[2000] flex items-end bg-black/60">
        <div class="max-h-[94%] w-full overflow-y-auto rounded-t-3xl bg-white p-4 dark:bg-slate-900" style="padding-bottom:max(env(safe-area-inset-bottom),16px)">${inner}</div>
      </div>`;
    $('backdrop').addEventListener('click', e => { if (e.target.id === 'backdrop' || e.target.closest('[data-close]')) closeModal(); });
  }
  const head = title => `<div class="mb-3 flex items-center justify-between gap-3"><h2 class="text-xl font-bold">${title}</h2>
    <button data-close class="grid h-12 w-12 shrink-0 place-items-center rounded-xl bg-slate-100 text-xl dark:bg-slate-800">✕</button></div>`;
  function comunaOptions(sel) {
    const names = COMUNAS.map(([n]) => n);
    if (sel && !names.includes(sel)) names.push(sel);
    return '<option value="">Elige la comuna…</option>' + names.sort((a, b) => a.localeCompare(b, 'es'))
      .map(n => `<option value="${esc(n)}"${n === sel ? ' selected' : ''}>${esc(n)}</option>`).join('');
  }

  // Campo de dirección con sugerencias mientras escribes + dictado por voz
  const addressField = (idp, value, placeholder) => `
    <div class="relative">
      <div class="flex gap-2">
        <input id="${idp}Addr" class="${INPUT}" placeholder="${placeholder}" autocomplete="off" value="${esc(value)}">
        <button id="${idp}Mic" type="button" aria-label="Dictar dirección" class="hidden h-12 w-12 shrink-0 rounded-xl border-2 border-slate-300 text-xl dark:border-slate-700">🎤</button>
      </div>
      <ul id="${idp}Sugg" class="mt-1 hidden divide-y divide-slate-200 overflow-hidden rounded-xl border-2 border-blue-500 bg-white dark:divide-slate-800 dark:bg-slate-900"></ul>
    </div>`;
  function wireAddress(idp, onPick, onType) {
    const input = $(idp + 'Addr'), list = $(idp + 'Sugg');
    let timer, ctrl, results = [];
    const show = html => { list.innerHTML = html; list.classList.toggle('hidden', !html); };
    input.addEventListener('input', () => {
      onType && onType();
      clearTimeout(timer); ctrl && ctrl.abort();
      const q = input.value.trim();
      if (q.length < 3) { show(''); return; }
      timer = setTimeout(async () => {
        ctrl = new AbortController();
        show('<li class="px-3 py-3 text-sm text-slate-500">Buscando…</li>');
        try {
          results = await searchAddress(q, ctrl.signal);
          show(results.length
            ? results.map((r, i) => `<li><button type="button" data-i="${i}" class="w-full px-3 py-3 text-left active:bg-blue-50 dark:active:bg-slate-800">
                <span class="block font-semibold">📍 ${esc(r.line)}</span>
                <span class="block text-sm text-slate-500">${esc([r.place, r.comuna].filter(Boolean).join(' · '))}${r.exact ? '' : ' · número aproximado'}</span></button></li>`).join('')
            : '<li class="px-3 py-3 text-sm text-slate-500">No encontré esa dirección. Escríbela igual y elige la comuna abajo.</li>');
        } catch (e) {
          if (e.name !== 'AbortError') show('<li class="px-3 py-3 text-sm text-slate-500">Sin conexión para buscar. Escríbela y elige la comuna abajo.</li>');
        }
      }, 250);
    });
    list.addEventListener('click', e => {
      const b = e.target.closest('[data-i]'); if (!b) return;
      const r = results[+b.dataset.i];
      input.value = r.line; show('');
      onPick(r);
    });
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      const mic = $(idp + 'Mic'); mic.classList.remove('hidden');
      mic.onclick = () => {
        try {
          const rec = new SR(); rec.lang = 'es-CL'; rec.interimResults = false;
          mic.textContent = '🔴';
          rec.onresult = ev => { input.value = ev.results[0][0].transcript; input.dispatchEvent(new Event('input')); };
          rec.onend = () => { mic.textContent = '🎤'; };
          rec.start();
        } catch { mic.textContent = '🎤'; }
      };
    }
  }
  function setComunaSelect(sel, name) {
    if (!name) return;
    if (![...sel.options].some(o => o.value === name)) sel.add(new Option(name, name));
    sel.value = name;
  }

  // ---------- Nueva ruta / ajustes ----------
  function openRouteForm(id) {
    const r = id ? routes[id] : null;
    const h = new Date().getHours();
    const ls = r ? r.start : (prefs.lastStart || null);
    let start = ls ? { ...ls } : null;
    let confirmDelete = false;
    sheet(`${head(r ? 'Ajustes de la ruta' : 'Nueva ruta')}
      <div class="space-y-3">
        <label class="${LABEL}">Nombre de la ruta<input id="rName" class="${INPUT} mt-1" value="${esc(r ? r.name : (h < 13 ? 'Ruta de la mañana' : 'Ruta de la tarde'))}"></label>
        <div><span class="${LABEL}">Día</span>
          <div class="mt-1 grid grid-cols-3 gap-2">
            <button type="button" data-day="0" class="dayBtn h-12 rounded-xl border-2 font-bold">Hoy</button>
            <button type="button" data-day="1" class="dayBtn h-12 rounded-xl border-2 font-bold">Mañana</button>
            <input id="rDate" type="date" class="${INPUT} px-1 text-sm" value="${esc(r ? r.date : (h >= 18 ? dayStr(1) : dayStr(0)))}">
          </div>
        </div>
        <label class="${LABEL}">Hora de salida<input id="rTime" type="time" class="${INPUT} mt-1" value="${esc(r ? r.startTime : '09:00')}"></label>
        <div><span class="${LABEL}">Punto de partida</span>
          <div class="mt-1">${addressField('s', start ? start.address : '', 'Ej: tu bodega o tu casa')}</div>
          <button id="rHere" type="button" class="mt-2 h-11 w-full rounded-xl border-2 border-slate-300 text-sm font-bold dark:border-slate-700">◎ Usar mi ubicación actual</button>
          <p id="rStartInfo" class="mt-1 text-xs font-semibold text-slate-500"></p>
        </div>
        <label class="flex items-center gap-3 rounded-xl border-2 border-slate-200 p-3 font-semibold dark:border-slate-700">
          <input id="rBack" type="checkbox" class="h-6 w-6" ${!r || r.returnToStart !== false ? 'checked' : ''}> Volver al punto de partida al terminar
        </label>
      </div>
      <p id="rErr" class="mt-2 hidden text-sm font-semibold text-red-600"></p>
      <button id="rSave" class="mt-4 h-16 w-full rounded-2xl bg-blue-600 text-lg font-bold text-white">${r ? 'Guardar cambios' : 'Crear ruta'}</button>
      ${r ? `<button id="rDup" class="mt-2 h-12 w-full rounded-xl border-2 border-slate-300 font-bold dark:border-slate-700">Copiar paradas a una ruta nueva</button>
             <button id="rDel" class="mt-2 h-12 w-full rounded-xl border-2 border-red-600 font-bold text-red-600">🗑 Borrar esta ruta</button>` : ''}`);

    const info = () => { $('rStartInfo').textContent = start ? `✓ Partida: ${start.address}${start.comuna ? ', ' + start.comuna : ''}` : 'Escribe la dirección y elígela de la lista, o usa tu ubicación.'; };
    info();
    wireAddress('s', p => { start = { address: p.line, comuna: p.comuna, lat: p.lat, lng: p.lng }; info(); }, () => { start = null; info(); });
    $('rHere').onclick = async () => {
      $('rHere').textContent = 'Buscando tu ubicación…';
      const pos = await myPosition();
      $('rHere').textContent = '◎ Usar mi ubicación actual';
      if (!pos) { toast('No pude obtener tu ubicación. Revisa que el GPS esté activado.'); return; }
      start = { address: 'Mi ubicación', comuna: '', lat: pos.lat, lng: pos.lng };
      $('sAddr').value = 'Mi ubicación'; info();
    };
    const paintDays = () => document.querySelectorAll('.dayBtn').forEach(b => {
      const on = $('rDate').value === dayStr(+b.dataset.day);
      b.className = `dayBtn h-12 rounded-xl border-2 font-bold ${on ? 'border-blue-600 bg-blue-600 text-white' : 'border-slate-300 dark:border-slate-700'}`;
    });
    document.querySelectorAll('.dayBtn').forEach(b => b.onclick = () => { $('rDate').value = dayStr(+b.dataset.day); paintDays(); });
    $('rDate').onchange = paintDays; paintDays();

    $('rSave').onclick = () => {
      const name = $('rName').value.trim() || 'Ruta', d = $('rDate').value;
      if (!d || !start) { $('rErr').textContent = !d ? 'Falta el día.' : 'Falta el punto de partida: elige una dirección de la lista o usa tu ubicación.'; $('rErr').classList.remove('hidden'); return; }
      prefs.lastStart = start;
      if (r) {
        Object.assign(r, { name, date: d, startTime: $('rTime').value || '09:00', start, returnToStart: $('rBack').checked });
        delete MAT[r.id]; changed(r, { keepOptimized: true }); closeModal(); openRoute(r.id); toast('Ruta actualizada');
      } else {
        const nr = { id: uid(), name, date: d, startTime: $('rTime').value || '09:00', start, returnToStart: $('rBack').checked, stops: [], optimized: false, createdAt: Date.now(), updatedAt: Date.now() };
        routes[nr.id] = nr; saveLocal(); closeModal(); openRoute(nr.id); toast('Ruta creada. Ahora agrega las paradas.');
      }
    };
    if (r) {
      $('rDup').onclick = () => {
        const nr = { ...JSON.parse(JSON.stringify(r)), id: uid(), name: r.name + ' (copia)', date: dayStr(1), optimized: false, geometry: null, createdAt: Date.now(), updatedAt: Date.now() };
        nr.stops = nr.stops.map(s => ({ ...s, id: uid(), status: 'pending', pod: undefined, doneMin: undefined }));
        routes[nr.id] = nr; saveLocal(); closeModal(); openRoute(nr.id); toast('Copia creada para mañana. Cambia el día en ⚙ si quieres.');
      };
      $('rDel').onclick = () => {
        if (!confirmDelete) { confirmDelete = true; $('rDel').textContent = 'Toca otra vez para borrar la ruta'; $('rDel').className = 'mt-2 h-12 w-full rounded-xl bg-red-600 font-bold text-white'; return; }
        delete routes[r.id]; delete MAT[r.id]; saveLocal(); goList(); toast('Ruta borrada');
      };
    }
  }

  // ---------- Agregar / editar parada ----------
  function openStopForm(stopId) {
    const r = cur();
    const s = stopId ? r.stops.find(x => x.id === stopId) : null;
    const v = k => esc(s ? s[k] : '');
    let pick = s ? { lat: s.lat, lng: s.lng, precise: !!s.precise } : null;
    sheet(`${head(s ? 'Editar parada' : 'Nueva parada')}
      <div class="space-y-3">
        <div><span class="${LABEL}">Dirección *</span><div class="mt-1">${addressField('f', s ? s.address : '', 'Escribe: calle y número')}</div></div>
        <label class="${LABEL}">Comuna *<select id="fComuna" class="${INPUT} mt-1">${comunaOptions(s ? s.comuna : '')}</select></label>
        <div id="fMapBox" class="hidden">
          <div id="fMap" class="h-44 w-full overflow-hidden rounded-xl border-2 border-slate-300 dark:border-slate-700"></div>
          <p class="mt-1 text-xs text-slate-500">Si el punto no está justo en la casa, arrastra el pin o toca el lugar correcto.</p>
        </div>
        <label class="${LABEL}">Cliente<input id="fName" class="${INPUT} mt-1" value="${v('customerName')}"></label>
        <label class="${LABEL}">Teléfono (para avisar por WhatsApp)<input id="fPhone" class="${INPUT} mt-1" inputmode="tel" placeholder="+56 9 1234 5678" value="${v('customerPhone')}"></label>
        <div class="grid grid-cols-2 gap-2">
          <label class="${LABEL}">Recibe desde<input id="fWs" type="time" class="${INPUT} mt-1" value="${v('timeWindowStart')}"></label>
          <label class="${LABEL}">Entregar antes de<input id="fWe" type="time" class="${INPUT} mt-1" value="${v('timeWindowEnd')}"></label>
        </div>
        <label class="${LABEL}">Prioridad<select id="fPri" class="${INPUT} mt-1">
          <option value="normal">Normal</option><option value="first">Primera (ir al comienzo)</option><option value="last">Última (dejar para el final)</option></select></label>
        <label class="${LABEL}">Ubicación en el vehículo<input id="fPos" class="${INPUT} mt-1" placeholder="Ej: atrás derecha" value="${v('vehiclePosition')}"></label>
        <label class="${LABEL}">Paquete<input id="fPkg" class="${INPUT} mt-1" placeholder="Ej: 2 cajas, caja café" value="${v('packageInfo')}"></label>
        <label class="${LABEL}">Notas<input id="fNotes" class="${INPUT} mt-1" placeholder="Ej: dejar en conserjería" value="${v('notes')}"></label>
      </div>
      <p id="fErr" class="mt-2 hidden text-sm font-semibold text-red-600"></p>
      <button id="fSave" class="mt-4 h-16 w-full rounded-2xl bg-blue-600 text-lg font-bold text-white">${s ? 'Guardar cambios' : 'Agregar parada'}</button>
      ${s ? '' : '<button id="fMore" class="mt-2 h-12 w-full rounded-xl border-2 border-blue-600 font-bold text-blue-700 dark:text-blue-300">Agregar y seguir con otra</button>'}`);
    $('fPri').value = s ? (s.priority || 'normal') : 'normal';

    let pinMarker = null;
    function showMini() {
      if (!pick || !window.L) return;
      $('fMapBox').classList.remove('hidden');
      if (!miniMap) {
        miniMap = L.map('fMap', { zoomControl: false, attributionControl: false });
        L.tileLayer(isDark() ? TILE_DARK : TILE_LIGHT, { maxZoom: 19 }).addTo(miniMap);
        miniMap.on('click', e => { pick = { lat: e.latlng.lat, lng: e.latlng.lng, precise: true }; pinMarker.setLatLng(e.latlng); });
      }
      miniMap.setView([pick.lat, pick.lng], 17);
      if (!pinMarker) {
        pinMarker = L.marker([pick.lat, pick.lng], { draggable: true, icon: L.divIcon({ className: '', iconSize: [34, 44], iconAnchor: [17, 42], html: '<svg width="34" height="44" viewBox="0 0 34 44"><path d="M17 1C8 1 1 8 1 17c0 12 16 26 16 26s16-14 16-26C33 8 26 1 17 1z" fill="#dc2626" stroke="#fff" stroke-width="2"/><circle cx="17" cy="17" r="6" fill="#fff"/></svg>' }) }).addTo(miniMap);
        pinMarker.on('dragend', () => { const ll = pinMarker.getLatLng(); pick = { lat: ll.lat, lng: ll.lng, precise: true }; });
      } else pinMarker.setLatLng([pick.lat, pick.lng]);
      setTimeout(() => miniMap && miniMap.invalidateSize(), 50);
    }
    wireAddress('f', p => {
      pick = { lat: p.lat, lng: p.lng, precise: true };
      setComunaSelect($('fComuna'), p.comuna);
      showMini();
    }, () => { pick = null; $('fMapBox').classList.add('hidden'); });
    if (s && s.precise) showMini();
    if (!s) setTimeout(() => $('fAddr')?.focus(), 80);

    const save = more => {
      const address = $('fAddr').value.trim(), comuna = $('fComuna').value;
      if (!address) { $('fErr').textContent = 'Falta la dirección.'; $('fErr').classList.remove('hidden'); return; }
      let lat, lng, precise;
      if (pick) ({ lat, lng, precise } = pick);
      else if (comuna && COMUNA[comuna]) { lat = COMUNA[comuna].lat; lng = COMUNA[comuna].lng; precise = false; }
      else { $('fErr').textContent = 'Elige la dirección de la lista, o al menos la comuna.'; $('fErr').classList.remove('hidden'); return; }
      const data = {
        address, comuna, lat, lng, precise,
        customerName: $('fName').value.trim(), customerPhone: $('fPhone').value.trim(),
        timeWindowStart: $('fWs').value || '', timeWindowEnd: $('fWe').value || '',
        priority: $('fPri').value, vehiclePosition: $('fPos').value.trim(),
        packageInfo: $('fPkg').value.trim(), notes: $('fNotes').value.trim(),
      };
      if (s) Object.assign(s, data); else r.stops.push({ id: uid(), status: 'pending', ...data });
      changed(r);
      ensureMatrix(r).then(() => { if (curId === r.id) render(); });
      render();
      if (more) { openStopForm(); toast('Parada agregada. Escribe la siguiente.'); }
      else { closeModal(); toast(s ? 'Parada actualizada' : 'Parada agregada'); }
    };
    $('fSave').onclick = () => save(false);
    if (!s) $('fMore').onclick = () => save(true);
  }

  // ---------- Prueba de entrega ----------
  const REASONS = [['cliente_ausente', 'Cliente ausente'], ['direccion_erronea', 'Dirección errónea'], ['rechazado', 'Rechazado'], ['acceso_cerrado', 'Acceso cerrado'], ['otro', 'Otro motivo']];
  function openPod(id) {
    const r = cur();
    const s = r.stops.find(x => x.id === id);
    let mode = 'delivered', reason = null, hasPhoto = false, sigReady = false, sigDirty = false;
    sheet(`${head('Prueba de entrega')}
      <p class="-mt-2 mb-3 truncate text-sm text-slate-600 dark:text-slate-400">${esc(s.address)}${s.comuna ? ', ' + esc(s.comuna) : ''}</p>
      <div class="mb-4 grid grid-cols-2 gap-2">
        <button id="mOk" class="h-14 rounded-xl text-lg font-bold">Entregada</button>
        <button id="mFail" class="h-14 rounded-xl text-lg font-bold">No entregada</button>
      </div>
      <div id="okPane" class="space-y-3">
        <label class="flex h-14 cursor-pointer items-center justify-center gap-2 rounded-xl border-2 border-dashed border-slate-300 font-bold dark:border-slate-700">
          📷 <span id="photoLbl">Tomar foto</span>
          <input id="photo" type="file" accept="image/*" capture="environment" class="hidden">
        </label>
        <img id="preview" class="hidden max-h-48 w-full rounded-xl object-cover" alt="Foto de la entrega">
        <div>
          <div class="mb-1 flex items-center justify-between"><span class="text-sm font-semibold">Firma del cliente</span>
            <button id="sigClear" class="text-sm font-semibold text-slate-500">Borrar</button></div>
          <canvas id="sig" class="h-40 w-full touch-none rounded-xl border-2 border-slate-300 bg-white"></canvas>
        </div>
        <input id="recipient" class="${INPUT}" placeholder="¿Quién recibió? (opcional)">
      </div>
      <div id="failPane" class="hidden grid grid-cols-2 gap-2">
        ${REASONS.map(([k, l]) => `<button data-reason="${k}" class="h-14 rounded-xl border-2 border-slate-200 font-semibold dark:border-slate-700">${l}</button>`).join('')}
      </div>
      <textarea id="note" rows="2" class="mt-3 w-full rounded-xl border-2 border-slate-300 bg-transparent p-3 dark:border-slate-700" placeholder="Nota (ej. dejado en conserjería)"></textarea>
      <button id="pSave" class="mt-3 h-16 w-full rounded-2xl text-lg font-bold text-white disabled:opacity-50"></button>`);

    function setupSig() {
      if (sigReady) return;
      const c = $('sig'); if (!c || !c.clientWidth) return;
      const ratio = window.devicePixelRatio || 1;
      c.width = c.clientWidth * ratio; c.height = c.clientHeight * ratio;
      const g = c.getContext('2d'); g.scale(ratio, ratio);
      g.lineWidth = 2.5; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#111827';
      let drawing = false;
      const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; };
      c.addEventListener('pointerdown', e => { drawing = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); g.beginPath(); g.moveTo(x, y); });
      c.addEventListener('pointermove', e => { if (!drawing) return; const [x, y] = pos(e); g.lineTo(x, y); g.stroke(); sigDirty = true; });
      c.addEventListener('pointerup', () => { drawing = false; });
      $('sigClear').onclick = () => { g.clearRect(0, 0, c.width, c.height); sigDirty = false; };
      sigReady = true;
    }
    const paint = () => {
      $('mOk').className = `h-14 rounded-xl text-lg font-bold ${mode === 'delivered' ? 'bg-green-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}`;
      $('mFail').className = `h-14 rounded-xl text-lg font-bold ${mode === 'failed' ? 'bg-red-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}`;
      $('okPane').classList.toggle('hidden', mode !== 'delivered');
      $('failPane').classList.toggle('hidden', mode !== 'failed');
      document.querySelectorAll('[data-reason]').forEach(b => {
        b.className = `h-14 rounded-xl border-2 font-semibold ${b.dataset.reason === reason ? 'border-red-600 bg-red-50 text-red-800 dark:bg-red-950 dark:text-red-200' : 'border-slate-200 dark:border-slate-700'}`;
      });
      const btn = $('pSave');
      btn.className = `mt-3 h-16 w-full rounded-2xl text-lg font-bold text-white disabled:opacity-50 ${mode === 'delivered' ? 'bg-green-600' : 'bg-red-600'}`;
      btn.textContent = mode === 'delivered' ? 'Confirmar entrega' : 'Marcar como no entregada';
      btn.disabled = mode === 'failed' && !reason;
      if (mode === 'delivered') setupSig();
    };
    $('mOk').onclick = () => { mode = 'delivered'; paint(); };
    $('mFail').onclick = () => { mode = 'failed'; paint(); };
    document.querySelectorAll('[data-reason]').forEach(b => b.onclick = () => { reason = b.dataset.reason; paint(); });
    $('photo').onchange = e => {
      const f = e.target.files?.[0]; if (!f) return;
      hasPhoto = true; $('preview').src = URL.createObjectURL(f); $('preview').classList.remove('hidden');
      $('photoLbl').textContent = 'Cambiar foto';
    };
    $('pSave').onclick = () => {
      const now = new Date();
      s.status = mode;
      s.doneMin = now.getHours() * 60 + now.getMinutes();
      if (r.date !== dayStr(0)) s.doneMin = s.etaMin ?? toMin(r.startTime);
      s.pod = mode === 'delivered'
        ? { recipient: $('recipient').value.trim(), hasPhoto, hasSig: sigDirty, note: $('note').value.trim(), at: Date.now() }
        : { reason, reasonLabel: REASONS.find(x => x[0] === reason)[1], note: $('note').value.trim(), at: Date.now() };
      changed(r, { keepOptimized: true }); closeModal(); ui.activeId = null; render();
      toast(mode === 'delivered' ? 'Entrega guardada' : 'Marcada como no entregada');
    };
    paint();
  }

  // ================= Avisos =================
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg;
    t.style.opacity = '1'; t.style.transform = 'translateY(0)';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; }, 2800);
  }

  // ================= Eventos =================
  $('routeList').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openRoute(b.dataset.open); });
  $('newRouteBtn').onclick = () => openRouteForm();
  $('backBtn').onclick = goList;
  $('settingsBtn').onclick = () => openRouteForm(curId);
  $('addBtn').onclick = () => openStopForm();
  $('navApp').onchange = e => { prefs.navApp = e.target.value; saveLocal(); render(); };
  document.querySelectorAll('.themeBtn').forEach(b => b.onclick = () => { prefs.dark = !isDark(); saveLocal(); render(); });
  $('locBtn').onclick = async () => {
    const pos = await myPosition();
    if (!pos) { toast('No pude obtener tu ubicación. Revisa que el GPS esté activado.'); return; }
    if (!ensureMap()) return;
    if (meMarker) meMarker.setLatLng([pos.lat, pos.lng]);
    else meMarker = L.circleMarker([pos.lat, pos.lng], { radius: 9, color: '#fff', weight: 3, fillColor: '#3b82f6', fillOpacity: 1 }).addTo(map);
    map.setView([pos.lat, pos.lng], 15);
  };

  function select(id, fromMap) {
    ui.confirmDel = null;
    ui.activeId = ui.activeId === id && !fromMap ? null : id;
    renderStops(cur()); renderMap(cur());
    if (fromMap) document.getElementById('stop-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  $('list').addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const r = cur(), id = act.dataset.id;
    const s = r.stops.find(x => x.id === id);
    const a = act.dataset.act;
    if (a === 'pod') { e.stopPropagation(); openPod(id); }
    else if (a === 'edit') { e.stopPropagation(); openStopForm(id); }
    else if (a === 'undo') { e.stopPropagation(); s.status = 'pending'; delete s.pod; delete s.doneMin; changed(r, { keepOptimized: true }); render(); }
    else if (a === 'del') {
      e.stopPropagation();
      if (ui.confirmDel !== id) { ui.confirmDel = id; renderStops(r); return; }
      r.stops = r.stops.filter(x => x.id !== id); ui.confirmDel = null; ui.activeId = null;
      changed(r, { keepOptimized: true }); render(); toast('Parada borrada');
    }
    else if (a === 'select' && !e.target.closest('.handle')) select(id, false);
  });

  const makeSortable = () => Sortable.create($('list'), {
    handle: '.handle', animation: 150, delay: 120, delayOnTouchOnly: true,
    onEnd(e) {
      if (e.oldIndex === e.newIndex) return;
      const r = cur();
      const [m] = r.stops.splice(e.oldIndex, 1);
      r.stops.splice(e.newIndex, 0, m);
      changed(r, { keepOptimized: true }); render(); toast('Orden cambiado, horas recalculadas');
    },
  });

  // Cargar mapa y arrastre en segundo plano: la pantalla responde al instante
  function loadScript(src) {
    return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.async = true; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
  }

  $('optBtn').onclick = async () => {
    const r = cur();
    const btn = $('optBtn'); btn.disabled = true; btn.textContent = 'Calculando rutas por calle…';
    const m = await ensureMatrix(r);
    const before = schedule(r).km;
    optimize(r, m);
    changed(r, { keepOptimized: true });
    render();
    btn.innerHTML = ICON.sparkle + ' Optimizar ruta';
    const saved = before - schedule(r).km;
    toast((saved > 0.5 ? `Ruta optimizada: ${saved.toFixed(1)} km menos` : 'Ruta optimizada') + (m.real ? '' : ' (sin conexión: distancias estimadas)'));
  };

  // ================= Arranque =================
  loadLocal();
  $('optBtn').innerHTML = ICON.sparkle + ' Optimizar ruta';
  render();
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js')
    .then(() => { if (view === 'route' && cur()) renderMap(cur()); }).catch(() => {});
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js')
    .then(makeSortable).catch(() => {});
  // Guardar la app en el teléfono (abre al instante, aunque no haya señal)
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
