    });
  }

  // ---------- Importar / escanear manifiesto ----------
  // Formatos: una direcci\u00f3n por l\u00ednea  |  "direcci\u00f3n; comuna; notas; tel\u00e9fono"  |  CSV con encabezados
  //           (direccion, comuna, cliente, telefono, notas)  |  archivo .json compartido desde esta app
  function parseManifest(text) {
    const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && !/^[-=_*#\s]+$/.test(l));
    if (!lines.length) return [];
    const sep = lines[0].includes('\t') ? '\t' : (lines[0].split(';').length > 1 ? ';' : (/direcci|address/i.test(lines[0]) ? ',' : null));
    const splitCsv = l => { const out = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(x => x.trim()); };
    let header = null;
    if (sep && /direcci|address|calle/i.test(lines[0])) header = splitCsv(lines.shift()).map(norm);
    const col = (row, ...keys) => { if (!header) return ''; const i = header.findIndex(h => keys.some(k => h.includes(k))); return i >= 0 ? (row[i] || '') : ''; };
    return lines.map(l => {
      if (header) { const row = splitCsv(l); return { address: col(row, 'direcc', 'address', 'calle'), comuna: col(row, 'comuna', 'ciudad', 'city'), customerName: col(row, 'cliente', 'nombre', 'name'), customerPhone: col(row, 'telef', 'fono', 'phone', 'celular'), notes: col(row, 'nota', 'note', 'obs') }; }
      if (sep) { const [a, c, n, p] = splitCsv(l); return { address: a || '', comuna: c || '', notes: n || '', customerPhone: p || '' }; }
      const clean = l.replace(/^\s*\d+[.)-]\s+/, '');   // quita numeraci\u00f3n "1. " de listas pegadas
      return { address: clean, comuna: '', notes: '' };
    }).filter(x => x.address);
  }
  async function geocodeLine(item) {
    const mine = matchPlaces(item.address)[0];                      // primero Mis lugares (por nombre)
    if (mine) { item.customerName = item.customerName || mine.placeName; return { address: mine.line, comuna: mine.comuna, lat: mine.lat, lng: mine.lng, precise: true, found: true }; }
    const comuna = COMUNA_BY_NORM[norm(item.comuna)] || findComuna(item.comuna || item.address);
    const q = item.comuna ? `${item.address}, ${item.comuna}` : item.address;
    let res = [];
    try { res = await searchAddress(q); } catch {}
    const best = (comuna && res.find(x => norm(x.comuna) === norm(comuna))) || res.find(x => x.exact) || res[0];
    const addressOnly = item.address.replace(new RegExp(',?\\s*' + (comuna || '@@').replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*$', 'i'), '').trim();
    if (best) return { address: best.line, comuna: best.comuna || comuna, lat: best.lat, lng: best.lng, precise: true, found: true };
    const c = comuna && COMUNA[comuna];
    return { address: addressOnly || item.address, comuna, lat: c ? c.lat : prefs.base.lat, lng: c ? c.lng : prefs.base.lng, precise: false, found: false };
  }
  async function ocrImage(file, onProgress) {
    if (!window.Tesseract) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    const { data } = await Tesseract.recognize(file, 'spa', { logger: m => m.status === 'recognizing text' && onProgress(Math.round(m.progress * 100)) });
    return data.text;
  }
  function openImport(scanFirst) {
    const r = cur();
    sheet(`${head(scanFirst ? '\ud83d\udcf7 Escanear manifiesto' : '\ud83d\udcc4 Importar manifiesto')}
      <p class="-mt-2 mb-3 text-sm text-slate-600 dark:text-slate-400">Pega las direcciones (una por l\u00ednea), carga un archivo CSV/TXT, o saca una foto a la hoja de despacho. Formato opcional: <b>direcci\u00f3n; comuna; notas; tel\u00e9fono</b>.</p>
      <div class="mb-2 grid grid-cols-2 gap-2">
        <label class="flex h-12 cursor-pointer items-center justify-center rounded-xl border-2 border-slate-300 font-bold dark:border-slate-700">\ud83d\udcf7 Foto / escanear<input id="iPhoto" type="file" accept="image/*" capture="environment" class="hidden"></label>
        <label class="flex h-12 cursor-pointer items-center justify-center rounded-xl border-2 border-slate-300 font-bold dark:border-slate-700">\ud83d\udcc1 Archivo<input id="iFile" type="file" accept=".csv,.txt,.json,text/plain,text/csv,application/json" class="hidden"></label>
      </div>
      <p id="iStatus" class="mb-2 text-sm font-semibold text-slate-500"></p>
      <textarea id="iText" rows="8" class="w-full rounded-xl border-2 border-slate-300 bg-transparent p-3 text-sm dark:border-slate-700" placeholder="Pedro Torres 1227, \u00d1u\u00f1oa; carga de pedido mayorista&#10;741 franklin, santiago&#10;Av. Sim\u00f3n Bol\u00edvar 3275; \u00d1u\u00f1oa; mercado libre; +56912345678"></textarea>
      <button id="iGo" class="mt-3 h-16 w-full rounded-2xl bg-blue-600 text-lg font-bold text-white disabled:opacity-50">Importar paradas</button>`);
    const status = t => { $('iStatus').textContent = t; };
    $('iPhoto').onchange = async e => {
      const f = e.target.files?.[0]; if (!f) return;
      status('Leyendo la foto\u2026 (la primera vez descarga el lector, puede tardar)');
      try { const txt = await ocrImage(f, p => status(`Leyendo la foto\u2026 ${p}%`)); $('iText').value = txt.trim(); status('Revisa el texto, corrige lo que haga falta y toca "Importar paradas".'); }
      catch { status('No pude leer la foto. Revisa la conexi\u00f3n o pega el texto a mano.'); }
    };
    $('iFile').onchange = async e => {
      const f = e.target.files?.[0]; if (!f) return;
      const txt = await f.text();
      try {
        const o = JSON.parse(txt);
        if (o && o.app === 'ruta-enrique' && o.route) {
          const nr = { ...o.route, id: uid(), name: o.route.name + ' (compartida)', geometry: null, createdAt: Date.now(), updatedAt: Date.now() };
          nr.stops = (nr.stops || []).map(s => ({ ...s, id: uid() }));
          routes[nr.id] = nr; saveLocal(); closeModal(); openRoute(nr.id); toast('Ruta compartida importada'); return;
        }
      } catch {}
      $('iText').value = txt; status('Archivo cargado. Revisa y toca "Importar paradas".');
    };
    $('iGo').onclick = async () => {
      const items = parseManifest($('iText').value);
      if (!items.length) return status('No hay direcciones para importar.');
      $('iGo').disabled = true;
      let ok = 0, approx = 0;
      for (let i = 0; i < items.length; i++) {
        status(`Ubicando ${i + 1} de ${items.length}: ${items[i].address}`);
        const g = await geocodeLine(items[i]);
        r.stops.push({ id: uid(), status: 'pending', priority: 'normal', ...g, customerName: items[i].customerName || '', customerPhone: items[i].customerPhone || '', notes: items[i].notes || '' });
        delete r.stops[r.stops.length - 1].found;
        g.found ? ok++ : approx++;
        await sleep(350);
      }
      changed(r); await ensureMatrix(r); closeModal(); render();
      toast(`${items.length} paradas importadas${approx ? ` (${approx} con ubicaci\u00f3n aproximada: rev\u00edsalas)` : ''}. Toca "Optimizar ruta".`);
    };
    if (scanFirst) setTimeout(() => $('iPhoto').click(), 200);
  }

  // =====================================================================
  // 11) EVENTOS Y ARRANQUE
  // =====================================================================
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.style.opacity = '1'; t.style.transform = 'translateY(0)';
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateY(8px)'; }, 3000);
  }
  $('routeList').addEventListener('click', e => { const b = e.target.closest('[data-open]'); if (b) openRoute(b.dataset.open); });
  $('newRouteBtn').onclick = () => openRouteForm();
  $('globalBtn').onclick = openGlobal;
  // El contenedor principal nunca debe quedar corrido (pasaba al escribir en ventanas o al importar)
  $('app').addEventListener('scroll', () => { if ($('app').scrollTop || $('app').scrollLeft) $('app').scrollTo(0, 0); });
  $('backBtn').onclick = goList;
  $('todayBtn').onclick = openToday;
  $('settingsBtn').onclick = () => openRouteForm(curId);
  $('menuBtn').onclick = openMenu;
  $('loadBtn').onclick = openLoad;
  $('printBtn').onclick = openSheet;
  document.querySelectorAll('.themeBtn').forEach(b => b.onclick = () => { prefs.dark = !isDark(); saveLocal(); render(); });
  // Fila de salida: "Marcar salida ahora" guarda la hora al instante; tocar el resto abre notas y hora
  $('startRow').addEventListener('click', e => {
    const r = cur();
    if (e.target.closest('[data-now]')) { r.load = { min: nowMin(), note: '' }; changed(r, { keepOptimized: true }); render(); toast(`Salida marcada a las ${hhmm(r.load.min)}`); return; }
    openLoad();
  });
  $('endRow').addEventListener('click', openEnd);
  $('sheetClose').onclick = () => $('sheetView').classList.remove('open');
  wireSheetDrag($('grab'), { tapToggle: true }); wireSheetDrag($('dragHead')); wireSheetDrag($('searchWrap')); wireSheetDrag($('routeFooter')); wireSheetDrag($('sheet'), { isList: true });

  // Bot\u00f3n "atr\u00e1s" del tel\u00e9fono: cierra ventanas, vuelve a Mis rutas y reci\u00e9n ah\u00ed sale de la app
  function handleBack() {
    if ($('modalRoot').innerHTML) { closeModal(); return true; }
    if ($('sheetView').classList.contains('open')) { $('sheetView').classList.remove('open'); return true; }
    if (view === 'route') {
      if (ui.select) { ui.select = null; render(); return true; }
      if (cur() && cur().date !== dayStr(0)) { goList(); return true; }   // venia del historial
      return false;                                                       // ruta de hoy: atras = salir
    }
    if (view === 'list') { openToday(); return true; }
    return false;
  }
  history.replaceState({ base: 1 }, '');
  history.pushState({ guard: 1 }, '');
  // Nunca se llama history.back(): eso dejaba la app en blanco. En la ruta de hoy, el primer "atras"
  // solo avisa; el segundo cierra la app de forma normal (como cualquier app de Android).
  let exitArmed = false;
  window.addEventListener('popstate', () => {
    if (handleBack()) { exitArmed = false; history.pushState({ guard: 1 }, ''); return; }
    if (!exitArmed) { exitArmed = true; toast('Toca atr\u00e1s otra vez para salir'); history.pushState({ guard: 1 }, '');
      setTimeout(() => { exitArmed = false; }, 2500); return; }
    // segundo toque: no se vuelve a poner el guardia, asi el siguiente "atras" cierra la app
  });
  // Si la app vuelve a mostrarse desde segundo plano o desde el historial del navegador, se vuelve a dibujar
  window.addEventListener('pageshow', () => { if (!cur() || view !== 'route') openToday(); else render(); });
  $('sheetPrint').onclick = () => window.print();
  $('sheetUnits').onchange = e => { prefs.units = e.target.value; saveLocal(); buildSheet(cur()); render(); };
  $('locBtn').onclick = async () => {
    const pos = await myPosition();
    if (!pos) return toast('No pude obtener tu ubicaci\u00f3n. Revisa que el GPS est\u00e9 activado.');
    if (!ensureMap()) return;
    if (meMarker) meMarker.setLatLng([pos.lat, pos.lng]);
    else meMarker = L.circleMarker([pos.lat, pos.lng], { radius: 9, color: '#fff', weight: 3, fillColor: '#3b82f6', fillOpacity: 1 }).addTo(map);
    map.setView([pos.lat, pos.lng], 15);
  };
  $('routeFooter').addEventListener('click', e => {
    const b = e.target.closest('[data-f]'); if (!b) return;
    const k = b.dataset.f, r = cur();
    if (k === 'opt') reoptimize();
    else if (k === 'upd') updateTimes();
    else if (k === 'print') openSheet();
    else if (k === 'finish') openEnd();
    else if (k === 'cancel') { ui.select = null; render(); }
    else if (k === 'all') { const all = ui.select.ids.size === r.stops.length; ui.select.ids = new Set(all ? [] : r.stops.map(s => s.id)); render(); }
    else if (k === 'go') finishSelection();
  });

  // Barra r\u00e1pida: escribir \u2192 elegir \u2192 la parada se agrega al instante
  const quick = wireAddress('q', p => {
    const r = cur();
    const nid = uid();
    r.stops.push({ id: nid, status: 'pending', priority: 'normal', kind: 'delivery', address: p.line, comuna: p.comuna, lat: p.lat, lng: p.lng, precise: true, pinManual: !!p.pinManual, notes: '', customerName: p.place || '' });
    $('qAddr').value = ''; changed(r);
    ensureMatrix(r).then(() => { if (curId === r.id) render(); });
    render(); openStopSheet(nid, { focusNotes: true });
  }, null, q => `<li><button type="button" data-manual class="w-full px-3 py-3 text-left text-sm font-semibold text-blue-700 dark:text-blue-300">\u270e Agregar "${esc(q)}" con m\u00e1s detalles\u2026</button></li>`);
  $('qAddr').addEventListener('focus', () => { if (isMobile() && (ui.sheetFrac || SNAP[1]) < 0.9) { ui.preSearch = ui.sheetFrac || SNAP[1]; setSheet(SNAP[2]); } });
  $('qAddr').addEventListener('blur', () => setTimeout(() => {
    if (ui.preSearch && !$('qAddr').value && $('qSugg').classList.contains('hidden') && !$('modalRoot').innerHTML) { setSheet(ui.preSearch); ui.preSearch = 0; }
  }, 300));
  $('qAddr').addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    const first = $('qSugg').querySelector('[data-i]');
    if (first && !$('qSugg').classList.contains('hidden')) first.click();
    else $('qAddr').dispatchEvent(new Event('input'));
  });
  $('qSugg').addEventListener('click', e => {
    if (!e.target.closest('[data-manual]')) return;
    const q = $('qAddr').value.trim(); quick.show(''); $('qAddr').value = '';
    openStopForm(null); setTimeout(() => { $('fAddr').value = q; const c = findComuna(q); if (c) setComunaSelect($('fComuna'), c); $('fAddr').dispatchEvent(new Event('input')); }, 120);
  });
  document.addEventListener('click', e => { if (!e.target.closest('#qSugg') && e.target.id !== 'qAddr') quick.show(''); });

  function select(id, fromMap) {
    ui.confirmDel = null;
    ui.activeId = ui.activeId === id && !fromMap ? null : id;
    renderStops(cur()); renderMap(cur());
    if (fromMap) { if (isMobile() && (ui.sheetFrac || SNAP[1]) < 0.45) setSheet(SNAP[1], false); setTimeout(() => document.getElementById('stop-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 120); }
  }
  $('list').addEventListener('click', e => {
    if (e.target.closest('a')) return;
    const act = e.target.closest('[data-act]'); if (!act) return;
    const r = cur(), id = act.dataset.id, s = r.stops.find(x => x.id === id), a = act.dataset.act;
    if (ui.select && a === 'select') { ui.select.ids.has(id) ? ui.select.ids.delete(id) : ui.select.ids.add(id); renderStops(r); renderFooter(r, schedule(r), totals(r)); return; }
    if (a === 'addFirst') { setSheet(SNAP[2], false); setTimeout(() => $('qAddr').focus(), 100); return; }
    if (a === 'copyFrom') return openCopyFrom();
    if (a === 'pod') { e.stopPropagation(); openPod(id); }
    else if (a === 'edit') { e.stopPropagation(); openStopForm(id); }
    else if (a === 'note') { e.stopPropagation(); openNote(id); }
    else if (a === 'undo') { e.stopPropagation(); resetStop(s); changed(r, { keepOptimized: true }); render(); }
    else if (a === 'del') {
      e.stopPropagation();
      if (ui.confirmDel !== id) { ui.confirmDel = id; renderStops(r); return; }
      r.stops = r.stops.filter(x => x.id !== id); ui.confirmDel = null; ui.activeId = null;
      changed(r, { keepOptimized: true }); render(); toast('Parada borrada');
    } else if (a === 'select' && !e.target.closest('.handle')) { ui.activeId = id; renderMap(r); openStopSheet(id); }
  });

  // Mapa y arrastre se cargan en segundo plano para que la pantalla responda al instante
  const loadScript = src => new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.async = true; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
  const makeSortable = () => Sortable.create($('list'), {
    handle: '.handle', animation: 150, delay: 120, delayOnTouchOnly: true,
    onEnd(e) {
      if (e.oldIndex === e.newIndex) return;
      const r = cur(); const [m] = r.stops.splice(e.oldIndex, 1); r.stops.splice(e.newIndex, 0, m);
      changed(r, { keepOptimized: true }); render(); toast('Orden cambiado, horas recalculadas');
    },
  });

  loadLocal();
  $('verTag').textContent = APP_VERSION;
  $('verTag2').textContent = 'Ruta Enrique ' + APP_VERSION;
  openToday();
  setTimeout(cleanupPhotos, 1500);
  // Si el GPS ya tiene permiso, se toma la ubicacion para que el buscador priorice lo cercano
  try { navigator.permissions?.query({ name: 'geolocation' }).then(st => { if (st.state === 'granted') myPosition(); }).catch(() => {}); } catch {}
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js').then(() => { if (view === 'route' && cur()) renderMap(cur()); }).catch(() => {});
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js').then(makeSortable).catch(() => {});
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
